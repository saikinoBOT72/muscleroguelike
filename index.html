<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレローグライク</title>
<style>
/* ===== SECTION: STYLE ===== */
:root{
  --bg:#14161c; --panel:#1e222c; --panel2:#252a36; --line:#333a48;
  --text:#e8ecf2; --dim:#8b93a5;
  --atk:#e2574c; --skl:#4caf7d; --dbf:#a86fd6; --pwr:#4a90d9;
  --hp:#d0453c; --block:#5a9fd4; --energy:#e8c34a; --gold:#e8c34a;
  --rare:#e8c34a; --uncommon:#5a9fd4; --common:#8b93a5; --basic:#5c6474;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.6; overscroll-behavior:none;
}
#app{max-width:480px;margin:0 auto;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.mr-screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:16px;gap:14px}
.mr-title{font-size:22px;font-weight:700;letter-spacing:.04em;margin:0}
.mr-sub{color:var(--dim);font-size:13px;margin:0}
.mr-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.mr-row{display:flex;gap:8px;align-items:center}
.mr-spacer{flex:1}
.mr-center{text-align:center}

.mr-btn{
  appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;font-weight:600;padding:12px 16px;border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .06s;width:100%;
}
.mr-btn:hover:not(:disabled){background:#2e3444;border-color:#4a5468}
.mr-btn:active:not(:disabled){transform:translateY(1px)}
.mr-btn:disabled{opacity:.4;cursor:default}
.mr-btn.primary{background:linear-gradient(180deg,#3a6ea8,#2f5a8a);border-color:#4a80bd}
.mr-btn.primary:hover{background:linear-gradient(180deg,#4479b6,#356397)}
.mr-btn.ghost{background:transparent}
.mr-btn.small{padding:8px 12px;font-size:13px;width:auto}

/* HUD */
.mr-hud{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;
}
.mr-hud .chip{display:flex;align-items:center;gap:4px;white-space:nowrap}
.mr-hud .hpv{color:var(--hp);font-weight:700}
.mr-hud .goldv{color:var(--gold);font-weight:700}
.mr-badge{
  font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);
}
.mr-badge.hard{color:#f0a04a;border-color:#7a5a30;background:#2a2018}

/* コア表示 */
.mr-cores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mr-core{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.mr-core .n{font-size:20px;font-weight:700;line-height:1.2}
.mr-core .l{font-size:11px;color:var(--dim)}
.mr-core.chest .n{color:var(--atk)} .mr-core.leg .n{color:var(--skl)}
.mr-core.twist .n{color:var(--dbf)} .mr-core.core .n{color:var(--pwr)}

/* カード */
.mr-card{
  position:relative;width:104px;min-height:146px;border-radius:9px;padding:8px;
  background:linear-gradient(180deg,var(--panel2),#1a1e28);
  border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;
  font-size:11px;line-height:1.4;cursor:default;flex:0 0 auto;
}
.mr-card .cname{font-size:12px;font-weight:700;line-height:1.25;padding-left:19px;min-height:15px}
.mr-card .ctext{color:#cfd6e2;flex:1}
.mr-card .ccost{
  position:absolute;top:-6px;left:-6px;width:23px;height:23px;border-radius:50%;
  background:var(--energy);color:#241d05;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;border:2px solid #14161c;
}
.mr-card .ctag{font-size:10px;color:var(--dim);letter-spacing:.04em}
.mr-card.cat-ATTACK{border-color:var(--atk)} .mr-card.cat-SKILL{border-color:var(--skl)}
.mr-card.cat-DEBUFF{border-color:var(--dbf)} .mr-card.cat-POWER{border-color:var(--pwr)}
.mr-card.rar-RARE{box-shadow:0 0 0 1px var(--rare) inset}
.mr-card.upgraded .cname{color:var(--rare)}
.mr-card.playable{cursor:pointer}
.mr-card.playable:hover{transform:translateY(-4px);transition:transform .1s}
.mr-card.disabled{opacity:.45}
.mr-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.mr-note{color:var(--dim);font-size:12px}
.mr-hr{height:1px;background:var(--line);border:0;margin:4px 0}
.mr-placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--dim);text-align:center;
}
.mr-debug{
  position:fixed;right:8px;bottom:8px;z-index:99;background:#2a1a1a;border:1px solid #6a3a3a;
  border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;max-width:170px;
}

/* 難易度選択 */
.mr-diff{display:flex;flex-direction:column;gap:10px}
.mr-diffbtn{
  text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;padding:14px;border-radius:10px;cursor:pointer;transition:border-color .12s,background .12s;
}
.mr-diffbtn:hover{background:#2e3444}
.mr-diffbtn .dn{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.mr-diffbtn .dd{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
.mr-diffbtn.normal{border-color:#3f6b93} .mr-diffbtn.normal .dn{color:#7fb6e6}
.mr-diffbtn.hard{border-color:#8a5a2a}   .mr-diffbtn.hard   .dn{color:#f0a04a}

/* 運動入力 */
.mr-ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mr-ex .exhead{display:flex;align-items:baseline;gap:8px}
.mr-ex .exname{font-weight:700;font-size:14px}
.mr-ex .excat{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.mr-ex.cat-ATTACK .excat{color:var(--atk);border-color:var(--atk)}
.mr-ex.cat-SKILL  .excat{color:var(--skl);border-color:var(--skl)}
.mr-ex.cat-DEBUFF .excat{color:var(--dbf);border-color:var(--dbf)}
.mr-ex.cat-POWER  .excat{color:var(--pwr);border-color:var(--pwr)}
.mr-ex .exinput{display:flex;gap:6px;align-items:center}
.mr-ex input[type=number]{
  flex:1;min-width:0;font:inherit;font-size:19px;font-weight:700;text-align:center;
  background:#12151b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 4px;
}
.mr-ex input[type=number]::-webkit-outer-spin-button,
.mr-ex input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mr-ex input[type=number]{-moz-appearance:textfield}
.mr-step{
  font:inherit;font-size:12px;font-weight:700;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:7px;padding:8px 0;cursor:pointer;min-width:38px;
}
.mr-step:hover{background:#2e3444}
.mr-ex .exout{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.mr-ex .exout b{color:var(--text)}
.mr-ex .exout .zero{color:#6a7183}

.mr-table{width:100%;border-collapse:collapse;font-size:12px}
.mr-table th,.mr-table td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
.mr-table th:first-child,.mr-table td:first-child{text-align:left}
.mr-table th{color:var(--dim);font-weight:600}
.mr-table td b{font-size:14px}

.mr-cathead{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:2px 0;
}
.mr-cathead .bar{flex:1;height:1px;background:var(--line)}
.mr-cathead.ATTACK{color:var(--atk)} .mr-cathead.SKILL{color:var(--skl)}
.mr-cathead.DEBUFF{color:var(--dbf)} .mr-cathead.POWER{color:var(--pwr)}
.mr-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.mr-sticky{flex:0 0 auto;background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}

/* 戦闘 */
.mr-battle{gap:10px;padding:12px}
.mr-enemies{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:6px}
.mr-enemy{
  background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px;
  min-width:132px;max-width:190px;flex:1 1 auto;display:flex;flex-direction:column;gap:6px;
}
.mr-enemy.targetable{border-color:var(--atk);cursor:pointer;box-shadow:0 0 12px rgba(226,87,76,.35)}
.mr-enemy.targetable:hover{background:#2a1f22}
.mr-enemy .eintent{font-size:15px;font-weight:800;color:#ffb4ac;min-height:22px;text-align:center}
.mr-enemy .ename{font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.mr-bar{position:relative;height:16px;background:#0f1218;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mr-bar .fill{height:100%;background:linear-gradient(180deg,#e2574c,#a63a32);transition:width .18s}
.mr-bar.hp .fill{background:linear-gradient(180deg,#d0453c,#8e2f28)}
.mr-bar .barlabel{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);
}
.estat{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:0}
.estat span{font-size:11px;padding:1px 6px;border-radius:99px;background:#161a22;border:1px solid var(--line)}
.estat .sblock{color:var(--block);border-color:#3b6d96}
.estat .weak{color:#9ad0ff} .estat .vulnerable{color:#ffa0a0}
.estat .bleed{color:#ff7b7b} .estat .strength{color:#ffcf6b}
.estat .evade{color:#8fe0b6} .estat .counter{color:#d6a0f0}
.estat .power{color:var(--pwr);border-color:#3b6d96}

.mr-pstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mr-log{
  background:#10131a;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  font-size:11.5px;color:#a8b0c0;line-height:1.55;max-height:92px;overflow-y:auto;
}
.mr-log div+div{margin-top:1px}
.mr-bbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mr-energy{
  background:#3a3106;border:1.5px solid var(--energy);color:var(--energy);
  border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;
}
.mr-energy b{font-size:17px}
.mr-energy.on{box-shadow:0 0 10px rgba(232,195,74,.3)}
.mr-pile{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.mr-hint{font-size:11.5px;color:#ffb4ac;text-align:center}
.mr-hand{
  display:flex;gap:7px;overflow-x:auto;padding:8px 2px 4px;min-height:160px;align-items:flex-start;
  scrollbar-width:thin;
}
.mr-hand .mr-card{width:98px;min-height:142px}
.mr-card.selected{outline:2px solid var(--energy);outline-offset:2px;transform:translateY(-6px)}
.mr-debug .t{font-size:10px;color:#c88;letter-spacing:.08em}
</style>
</head>

"use strict";

/* ===== SECTION: UTIL ===== */
const rnd   = (n) => Math.floor(Math.random() * n);
const pick  = (arr) => arr[rnd(arr.length)];
const range = (min, max) => min + rnd(max - min + 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** entries: [{v, w}] → w の重みで v を1つ返す */
function weightedPick(entries){
  let total = 0;
  for (const e of entries) total += e.w;
  if (total <= 0) return entries.length ? entries[0].v : null;
  let r = Math.random() * total;
  for (const e of entries){ r -= e.w; if (r < 0) return e.v; }
  return entries[entries.length - 1].v;
}

function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function btn(label, cls, onClick){
  const b = el('button', 'mr-btn ' + (cls || ''), label);
  b.addEventListener('click', onClick);
  return b;

/* カードインスタンス(uid で個体を識別する) */
let _uid = 1;
function newCardInstance(id, upgraded){
  return { uid: _uid++, id: id, upgraded: !!upgraded };
}
/** upgraded を反映した実効カード定義を返す */
function effectiveCard(inst){
  const base = CARDS[inst.id];
  if (!base) throw new Error('未知のカードID: ' + inst.id);
  if (!inst.upgraded || !base.up) return base;
  return Object.assign({}, base, base.up, { name: base.name + '+' });
}

/** カード1種がアンロード済か。Phase 8 でメタ進行に接続する */
function isUnlocked(cardId){
  const c = CARDS[cardId];
  if (!c) return false;
  if (c.rarity === 'BASIC' || c.rarity === 'COMMON') return true;
  return true; // TODO(Phase 8): G.meta.unlocked.includes(cardId) に置き換える
}

/** プランクの秒数を他種目と同じ「回数」に正規化する */
function toCount(exKey, rawValue){
  const v = Math.max(0, Math.floor(rawValue || 0));
  if (exKey === 'plankSeconds') return Math.floor(v / PLANK_SECONDS_PER_COUNT);
  return v;
}

/** 入力値 → カテゴリごとの count */
function normalizeExercise(input){
  const out = {};
  for (const ex of EXERCISES) out[ex.cat] = toCount(ex.key, input[ex.key]);
  return out;
}

/** 回数 → 生成カード枚数(0〜4) */
function cardsFromCount(count){
  return Math.min(Math.floor(Math.sqrt(Math.max(0, count) / 5)), 4);
}

/** 回数 → 獲得筋力コア(0〜5、難易度倍率適用前) */
function coresFromCount(count){
  return Math.min(Math.floor(Math.max(0, count) / 10), 5);
}

/** 難易度倍率まで適用した獲得コア数 */
function coresGained(count, diffKey){
  return Math.floor(coresFromCount(count) * DIFFICULTY[diffKey].coreMult);
}

const RARITY_ORDER = ['RARE','UNCOMMON','COMMON'];

/** レアリティ抽選(BASIC は対象外) */
function rollRarity(diffKey){
  const b = DIFFICULTY[diffKey].rareWeightBonus;
  return weightedPick([
    { v:'COMMON',   w: 65 - b },
    { v:'UNCOMMON', w: 25 },
    { v:'RARE',     w: 10 + b },
  ]);
}

/** 指定カテゴリ・レアリティから1枚選ぶ。候補が尽きたらレアリティを1段下げる */
function rollCardOf(cat, rarity, deckSoFar){
  const counts = {};
  for (const inst of deckSoFar) counts[inst.id] = (counts[inst.id] || 0) + 1;

  let idx = RARITY_ORDER.indexOf(rarity);
  if (idx < 0) idx = RARITY_ORDER.indexOf('COMMON');

  for (let i = idx; i < RARITY_ORDER.length; i++){
    const r = RARITY_ORDER[i];
    const all = CARD_LIST.filter(c => c.cat === cat && c.rarity === r && isUnlocked(c.id));
    if (!all.length) continue;
    const fresh = all.filter(c => (counts[c.id] || 0) < 3);
    const pool = fresh.length ? fresh : all;   // 全部3枚に達していたら制限を解除
    return pick(pool).id;
  }
  return null;
}

/** 初期デッキ8枚 + 運動由来カード(最大16枚) */
function buildDeck(exercise, meta, diffKey){
  const deck = STARTING_DECK.map(id =>
    newCardInstance(id, meta.upgradedBasics.includes(id)));

  const counts = normalizeExercise(exercise);
  for (const ex of EXERCISES){
    const n = cardsFromCount(counts[ex.cat]);
    for (let i = 0; i < n; i++){
      const id = rollCardOf(ex.cat, rollRarity(diffKey), deck);
      if (id) deck.push(newCardInstance(id, false));
    }
  }
  return deck;
}

let B = null;   // G.battle のショートカット

function newStatus(){ return { weak:0, vulnerable:0, bleed:0, strength:0 }; }

function makeEnemy(id, idx){
  const def = ENEMIES[id];
  if (!def) throw new Error('未知の敵ID: ' + id);
  const d = DIFFICULTY[G.run.difficulty];
  const hp = Math.round(range(def.hpMin, def.hpMax) * d.enemyHpMult);
  return {
    uid: 'e' + idx, id: id, name: def.name, tier: def.tier,
    hp: hp, maxHp: hp, block: 0,
    status: Object.assign(newStatus(), { strength: d.enemyStartStrength[def.tier] || 0 }),
    phaseIdx: 0, patternIdx: def.startPatternIdx || 0,
    intent: null, turnCount: 0, alive: true,
  };
}

function log(msg){
  if (!msg) return;
  B.log.push(msg);
  if (B.log.length > 60) B.log.shift();
}

function startBattle(enemyIds){
  B = G.battle = {
    enemyIds: enemyIds.slice(),
    enemies: enemyIds.map((id, i) => makeEnemy(id, i)),
    drawPile: [], hand: [], discardPile: [], exhaustPile: [], powers: [],
    energy: 3, maxEnergy: 3,
    block: 0, status: newStatus(),
    evade: 0, counter: 0, keepBlock: false, reflectPending: 0,
    blockPerTurn: [],
    attacksPlayedThisTurn: 0,
    turn: 0, phase: 'PLAYER',
    selecting: null,
    log: [],
  };
  B.drawPile = shuffle(G.run.deck.map(c => ({ uid:c.uid, id:c.id, upgraded:c.upgraded })));
  log('戦闘開始: ' + B.enemies.map(e => e.name).join(' / '));
  // TODO(Phase 7): fireRelicHook('onBattleStart')
  startPlayerTurn();
  go('BATTLE');
}

function startPlayerTurn(){
  B.turn++;
  B.phase = 'PLAYER';
  B.selecting = null;
  B.energy = B.maxEnergy;
  if (!B.keepBlock) B.block = 0;
  // 回避 / 反撃は直前の敵ターンを守るためのもの。持ち越さない
  B.evade = 0;
  B.counter = 0;

  // ターン開始時のブロック(踏ん張り / 継続する強さ)
  for (let i = B.blockPerTurn.length - 1; i >= 0; i--){
    const bp = B.blockPerTurn[i];
    gainBlock(bp.value);
    log('ターン開始: ブロック+' + bp.value);
    if (bp.turnsLeft !== Infinity){
      bp.turnsLeft--;
      if (bp.turnsLeft <= 0) B.blockPerTurn.splice(i, 1);
    }
  }

  if (B.status.weak > 0) B.status.weak--;
  if (B.status.vulnerable > 0) B.status.vulnerable--;
  B.attacksPlayedThisTurn = 0;

  drawCard(Math.max(0, 5 - B.hand.length));
  for (const e of B.enemies) if (e.alive) e.intent = decideIntent(e);
  // TODO(Phase 7): fireRelicHook('onTurnStart')
}

function drawCard(n){
  for (let i = 0; i < n; i++){
    if (B.hand.length >= MAX_HAND){ log('手札が上限(' + MAX_HAND + '枚)のため引けない'); return; }
    if (!B.drawPile.length){
      if (!B.discardPile.length) { log('山札が尽きた'); return; }
      B.drawPile = shuffle(B.discardPile);
      B.discardPile = [];
      log('捨て札をシャッフルして山札に戻した');
    }
    B.hand.push(B.drawPile.pop());
  }
}

/* --- ダメージ計算 --- */
function calcDamage(base, attacker, defender, opts){
  opts = opts || {};
  const useStr  = opts.strength   !== false;
  const useWeak = opts.weak       !== false;
  const useVuln = opts.vulnerable !== false;
  let v = base + (useStr ? (attacker.status.strength || 0) : 0);
  if (v < 0) v = 0;
  if (useVuln && defender.status.vulnerable > 0) v *= 1.5;
  if (useWeak && attacker.status.weak > 0) v *= 0.75;
  return Math.floor(v);
}

function playerActor(){ return { isPlayer:true, status: B.status }; }

function gainBlock(v){
  let amount = v;
  for (const p of B.powers){
    for (const e of effectiveCard(p).effects) if (e.type === 'blockBonus') amount += e.value;
  }
  if (amount < 0) amount = 0;
  B.block += amount;
  return amount;
}

function dealDamageToEnemy(enemy, amount, opts){
  if (!enemy.alive || amount <= 0) return 0;
  opts = opts || {};
  let dealt = amount;
  if (!opts.ignoreBlock){
    const absorbed = Math.min(enemy.block, dealt);
    enemy.block -= absorbed;
    dealt -= absorbed;
  }
  enemy.hp -= dealt;
  if (enemy.hp <= 0){
    enemy.hp = 0;
    enemy.alive = false;
    log(enemy.name + 'を倒した!');
    onEnemyDeath(enemy);
  }
  return dealt;
}

function onEnemyDeath(dead){
  for (const e of B.enemies){
    if (e === dead || !e.alive) continue;
    const def = ENEMIES[e.id];
    if (def.onAllyDeath) log(def.onAllyDeath(e));
  }
}

/** 敵からプレイヤーへの攻撃1ヒット分 */
function dealDamageToPlayer(amount, source){
  if (B.evade > 0){
    B.evade--;
    log('回避! 攻撃を無効化した(残り' + B.evade + ')');
    triggerCounter(source);
    return 0;
  }
  const absorbed = Math.min(B.block, amount);
  B.block -= absorbed;
  const through = amount - absorbed;
  G.run.hp -= through;
  if (G.run.hp < 0) G.run.hp = 0;
  log('プレイヤーに' + amount + 'ダメージ'
      + (absorbed ? '(ブロックで' + absorbed + '軽減)' : '')
      + ' → HP ' + G.run.hp);
  triggerCounter(source);
  return through;
}

function triggerCounter(source){
  if (B.counter <= 0 || !source || !source.alive) return;
  const dmg = B.counter;
  B.counter = 0;
  log('カウンター! ' + source.name + 'に' + dmg + 'ダメージ');
  dealDamageToEnemy(source, dmg);
}

/* --- カード使用 --- */
function cardCost(card){
  let cost = card.cost;
  // TODO(Phase 7): fireRelicHook('onCardCost')
  return Math.max(0, cost);
}

function livingEnemies(){ return B.enemies.filter(e => e.alive); }

function canPlay(inst){
  if (B.phase !== 'PLAYER') return false;
  return cardCost(effectiveCard(inst)) <= B.energy;
}

/** handIndex のカードを使う。targetIdx は B.enemies のインデックス */
function playCard(handIndex, targetIdx){
  if (B.phase !== 'PLAYER') return;
  const inst = B.hand[handIndex];
  if (!inst) return;
  const card = effectiveCard(inst);
  const cost = cardCost(card);
  if (cost > B.energy){ log('Energyが足りない'); return; }

  const alive = livingEnemies();
  if (!alive.length) return;
  let target = null;
  if (card.target === 'single'){
    target = B.enemies[targetIdx];
    if (!target || !target.alive) target = alive[0];
  }

  B.energy -= cost;
  B.hand.splice(handIndex, 1);
  B.selecting = null;
  log('▶ ' + card.name + (card.target === 'single' && alive.length > 1 ? ' → ' + target.name : ''));

  const ctx = { card: card, inst: inst, target: target };
  for (const e of card.effects) resolveEffect(e, ctx);

  if (card.type === 'attack') B.attacksPlayedThisTurn++;
  if (card.type === 'power' ) firePowerUsed(card);

  if (card.keep)          B.powers.push(inst);
  else if (card.exhaust)  B.exhaustPile.push(inst);
  else                    B.discardPile.push(inst);

  checkBattleEnd();
  if (B.phase === 'PLAYER') render();
}

/** 忍耐【Power】: POWERカードを使うたびブロック */
function firePowerUsed(justPlayed){
  for (const p of B.powers){
    for (const e of effectiveCard(p).effects){
      if (e.type === 'blockOnPower'){
        const got = gainBlock(e.value);
        log('[忍耐] ブロック+' + got);
      }
    }
  }
}

/* --- 効果解決 --- */
function resolveEffect(e, ctx){
  const card = ctx.card;
  const me = playerActor();
  const targets = card.target === 'all' ? livingEnemies()
                : ctx.target ? [ctx.target] : [];

  switch (e.type){
    case 'damage': {
      for (const t of targets){
        const dmg = calcDamage(e.value, me, t, { strength: card.type === 'attack' });
        dealDamageToEnemy(t, dmg);
        log(t.name + 'に' + dmg + 'ダメージ (残HP ' + t.hp + ')');
      }
      break;
    }
    case 'damageMulti': {
      for (let i = 0; i < e.times; i++){
        for (const t of targets){
          if (!t.alive) continue;
          const dmg = calcDamage(e.value, me, t, { strength: card.type === 'attack' });
          dealDamageToEnemy(t, dmg);
          log(t.name + 'に' + dmg + 'ダメージ (' + (i + 1) + '/' + e.times + ', 残HP ' + t.hp + ')');
        }
      }
      break;
    }
    case 'block': {
      const got = gainBlock(e.value);
      log('ブロック+' + got + ' (合計' + B.block + ')');
      break;
    }
    case 'draw':
      drawCard(e.value);
      log('カードを' + e.value + '枚引いた');
      break;
    case 'status': {
      for (const t of targets){
        t.status[e.key] = (t.status[e.key] || 0) + e.value;
        log(t.name + 'に' + STATUS_NAME[e.key] + e.value + 'を付与');
      }
      break;
    }
    case 'evade':
      B.evade += e.value;
      log('回避態勢(' + B.evade + '回)');
      break;
    case 'blockPerTurn':
      B.blockPerTurn.push({ value: e.value, turnsLeft: e.turns === 0 ? Infinity : e.turns });
      log(e.turns === 0 ? '毎ターン開始時にブロック' + e.value
                        : e.turns + 'ターンの間ターン開始時にブロック' + e.value);
      break;
    default:
      console.warn('未実装のeffect(Phase 3で実装): ' + e.type);
  }
}

/* --- ターン終了 / 敵ターン --- */
function endPlayerTurn(){
  if (B.phase !== 'PLAYER') return;
  B.phase = 'ENEMY';
  B.selecting = null;

  // 反発: 残ブロック分を敵全体に反射
  if (B.reflectPending > 0 && B.block > 0){
    const me = playerActor();
    for (const t of livingEnemies()){
      const dmg = calcDamage(B.block, me, t, { strength:false, weak:false });
      dealDamageToEnemy(t, dmg);
      log('[反発] ' + t.name + 'に' + dmg + 'ダメージ');
    }
  }
  B.reflectPending = 0;

  while (B.hand.length) B.discardPile.push(B.hand.pop());

  if (checkBattleEnd()) return;
  render();
  setTimeout(runEnemyTurn, 350);
}

function runEnemyTurn(){
  if (!B || B.phase !== 'ENEMY') return;
  const queue = livingEnemies().slice();
  const step = () => {
    if (!B || B.phase !== 'ENEMY') return;
    const e = queue.shift();
    if (!e){ finishEnemyTurn(); return; }
    if (e.alive) actEnemy(e);
    render();
    if (checkBattleEnd()) return;
    setTimeout(step, 320);
  };
  step();
}

function actEnemy(e){
  const def = ENEMIES[e.id];
  e.block = 0;                                  // 敵のブロックは自ターン開始時に消える
  if (def.onTurnStart) log(def.onTurnStart(e));

  const act = e.intent || decideIntent(e);
  const d = DIFFICULTY[G.run.difficulty];

  if (act.intent === 'attack'){
    const times = act.times || 1;
    const base = Math.floor(act.value * d.enemyDmgMult);
    for (let i = 0; i < times; i++){
      const dmg = calcDamage(base, e, playerActor(), {});
      log(e.name + 'の攻撃' + (times > 1 ? '(' + (i + 1) + '/' + times + ')' : ''));
      dealDamageToPlayer(dmg, e);
      if (G.run.hp <= 0) break;
    }
  } else if (act.intent === 'block'){
    e.block += act.value;
    log(e.name + 'はブロック' + act.value + 'を得た');
  } else if (act.intent === 'buff'){
    e.status.strength += act.value;
    log(e.name + 'の力+' + act.value);
  } else if (act.intent === 'heal'){
    e.hp = Math.min(e.maxHp, e.hp + act.value);
    log(e.name + 'はHPを' + act.value + '回復した (' + e.hp + ')');
  }
  // 複合キー
  if (act.strength){ e.status.strength += act.strength; log(e.name + 'の力+' + act.strength); }
  if (act.heal && act.intent !== 'heal'){
    e.hp = Math.min(e.maxHp, e.hp + act.heal);
    log(e.name + 'はHPを' + act.heal + '回復した (' + e.hp + ')');
  }
  if (act.status){
    for (const k in act.status){
      B.status[k] = (B.status[k] || 0) + act.status[k];
      log('プレイヤーに' + STATUS_NAME[k] + act.status[k] + 'を付与');
    }
  }

  if (e.status.weak > 0) e.status.weak--;
  if (e.status.vulnerable > 0) e.status.vulnerable--;
  e.turnCount++;
  advancePattern(e);
}

function finishEnemyTurn(){
  // ターン終了時: 出血
  for (const e of livingEnemies()){
    if (e.status.bleed > 0){
      let amount = e.status.bleed;
      // TODO(Phase 7): fireRelicHook('onBleedDamage')
      dealDamageToEnemy(e, amount, { ignoreBlock:true });
      log('[出血] ' + e.name + 'に' + amount + 'ダメージ (残HP ' + e.hp + ')');
    }
  }
  if (checkBattleEnd()) return;
  startPlayerTurn();
  render();
}

/* --- 敵AI(Phase 2 は固定ループのみ。Phase 4 でフェーズ/重み抽選に拡張) --- */
function currentPhase(e){
  const def = ENEMIES[e.id];
  return def.phases[e.phaseIdx] || def.phases[0];
}
function decideIntent(e){
  const ph = currentPhase(e);
  return ph.pattern[e.patternIdx % ph.pattern.length];
}
function advancePattern(e){
  e.patternIdx++;
  if (e.alive) e.intent = decideIntent(e);
}

/* --- 勝敗判定 --- */
function checkBattleEnd(){
  if (G.run.hp <= 0){
    B.phase = 'LOSE';
    log('敗北…');
    setTimeout(() => { go('GAMEOVER'); }, 400);
    return true;
  }
  if (!livingEnemies().length){
    B.phase = 'WIN';
    log('戦闘に勝利した!');
    setTimeout(() => { go('REWARD'); }, 400);
    return true;
  }
  return false;
}

  if (inst.upgraded) cls.push('upgraded');

  node.appendChild(el('div', 'ctag', CAT_LABEL[c.cat] + ' / ' + RARITY_LABEL[c.rarity]));

/* --- 運動記録の入力 --- */
function renderExercise(){
  if (!G.draft) { G.draft = newDraft('NORMAL'); }
  const draft = G.draft;
  const d = DIFFICULTY[draft.difficulty];

  const s = el('div', 'mr-screen');
  const head = el('div');
  head.appendChild(el('h2', 'mr-title', '今日の運動記録'));
  head.appendChild(el('p', 'mr-sub',
    '回数がそのままデッキになる。難易度: <b>' + d.label + '</b>'));
  s.appendChild(head);

  const scroll = el('div', 'mr-scroll');
  const updaters = [];

  for (const ex of EXERCISES){
    const box = el('div', 'mr-ex cat-' + ex.cat);
    const h = el('div', 'exhead');
    h.appendChild(el('span', 'exname', ex.label));
    h.appendChild(el('span', 'excat', CAT_NAME[ex.cat] + '(' + CAT_LABEL[ex.cat] + ')'));
    box.appendChild(h);

    const row = el('div', 'exinput');
    const input = el('input');
    input.type = 'number'; input.min = '0'; input.step = '1';
    input.value = String(draft.exercise[ex.key] || 0);
    input.setAttribute('aria-label', ex.label);

    const out = el('div', 'exout');
    const update = () => {
      let v = Math.max(0, Math.floor(Number(input.value) || 0));
      input.value = String(v);
      draft.exercise[ex.key] = v;
      const count = toCount(ex.key, v);
      const cards = cardsFromCount(count);
      const cores = coresGained(count, draft.difficulty);
      const parts = [];
      if (ex.key === 'plankSeconds'){
        parts.push('<span>' + v + '秒 → <b>' + count + 'カウント</b>相当</span>');
      }
      parts.push('<span>生成カード <b class="' + (cards ? '' : 'zero') + '">' + cards + '枚</b>'
                 + (cards === 4 ? '(上限)' : '') + '</span>');
      parts.push('<span>' + ex.coreLabel + ' <b class="' + (cores ? '' : 'zero') + '">+' + cores + '</b></span>');
      out.innerHTML = parts.join('');
    };
    updaters.push(update);

    // btn() は mr-btn クラスを付けてしまうので、ステッパーは個別に組む
    const mkStep = (delta) => {
      const b = el('button', 'mr-step', (delta > 0 ? '+' : '') + delta);
      b.addEventListener('click', () => {
        input.value = String(Math.max(0, (Number(input.value) || 0) + delta));
        update(); updateTotal();
      });
      return b;
    };
    row.appendChild(mkStep(-10));
    row.appendChild(mkStep(-1));
    row.appendChild(input);
    row.appendChild(mkStep(1));
    row.appendChild(mkStep(10));
    input.addEventListener('input', () => { update(); updateTotal(); });
    input.addEventListener('blur', () => { update(); updateTotal(); });

    box.appendChild(row);
    box.appendChild(out);
    scroll.appendChild(box);
  }

  const total = el('div', 'mr-panel');
  const updateTotal = () => {
    const counts = normalizeExercise(draft.exercise);
    let n = 0;
    for (const ex of EXERCISES) n += cardsFromCount(counts[ex.cat]);
    total.innerHTML =
      '<div class="mr-note">デッキ枚数</div>'
      + '<div style="font-size:20px;font-weight:700">' + (STARTING_DECK.length + n) + '枚'
      + ' <span class="mr-note" style="font-size:12px">(基本' + STARTING_DECK.length + ' + 生成' + n + ')</span></div>';
  };
  for (const u of updaters) u();
  updateTotal();
  scroll.appendChild(total);
  scroll.appendChild(el('div', 'mr-note',
    '※ プランクは' + PLANK_SECONDS_PER_COUNT + '秒=1カウント換算。'
    + '生成枚数は floor(√(回数÷5)) で、1種目あたり最大4枚。'));
  s.appendChild(scroll);

  const foot = el('div', 'mr-sticky');
  foot.appendChild(btn('この記録でデッキを組む', 'primary', () => {
    draft.deck = buildDeck(draft.exercise, G.meta, draft.difficulty);
    go('DECK_PREVIEW');
  }));
  foot.appendChild(btn('難易度を選び直す', 'ghost', () => { G.draft = null; go('DIFFICULTY'); }));
  s.appendChild(foot);
  return s;
}

/* --- デッキ確認 --- */
function renderDeckPreview(){
  const draft = G.draft;
  if (!draft || !draft.deck){ go('EXERCISE'); return el('div'); }
  const counts = normalizeExercise(draft.exercise);
  const startIds = STARTING_DECK.slice();

  // 初期デッキ分を取り除いた残り = 生成カード
  const generated = [];
  const pool = startIds.slice();
  for (const inst of draft.deck){
    const i = pool.indexOf(inst.id);
    if (i >= 0) pool.splice(i, 1); else generated.push(inst);
  }

  const s = el('div', 'mr-screen');
  const head = el('div');
  head.appendChild(el('h2', 'mr-title', 'デッキ確認'));
  head.appendChild(el('p', 'mr-sub',
    '全' + draft.deck.length + '枚(基本' + startIds.length + ' + 生成' + generated.length + ')'
    + ' / ' + DIFFICULTY[draft.difficulty].label));
  s.appendChild(head);

  const scroll = el('div', 'mr-scroll');

  // 換算表
  const tp = el('div', 'mr-panel');
  const t = el('table', 'mr-table');
  t.innerHTML = '<thead><tr><th>種目</th><th>入力</th><th>換算</th><th>カード</th><th>コア</th></tr></thead>';
  const tb = el('tbody');
  for (const ex of EXERCISES){
    const raw = draft.exercise[ex.key] || 0;
    const c = counts[ex.cat];
    const tr = el('tr');
    tr.innerHTML = '<td>' + ex.label + '</td>'
      + '<td>' + raw + ex.unit + '</td>'
      + '<td>' + c + '</td>'
      + '<td><b>' + cardsFromCount(c) + '</b></td>'
      + '<td><b>+' + coresGained(c, draft.difficulty) + '</b></td>';
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  tp.appendChild(t);
  tp.appendChild(el('div', 'mr-note',
    'コアはラン終了時に獲得。<b>敗北した場合は50%没収</b>(端数切り上げ)。'));
  scroll.appendChild(tp);

  // 生成カード
  if (generated.length){
    scroll.appendChild(el('div', 'mr-cathead', '<span>運動で生成されたカード</span><span class="bar"></span>'));
    for (const cat of CATEGORIES){
      const list = generated.filter(i => CARDS[i.id].cat === cat);
      if (!list.length) continue;
      const h = el('div', 'mr-cathead ' + cat);
      h.innerHTML = '<span>' + CAT_NAME[cat] + '(' + CAT_LABEL[cat] + ') ' + list.length + '枚</span><span class="bar"></span>';
      scroll.appendChild(h);
      scroll.appendChild(renderDeckList(list, {}));
    }
  } else {
    scroll.appendChild(el('div', 'mr-panel mr-note',
      '運動由来のカードはありません。基本デッキ8枚だけで挑みます。'
      + '<br>1種目5回(プランクは10秒)から1枚生成されます。'));
  }

  // 初期デッキ
  scroll.appendChild(el('div', 'mr-cathead', '<span>基本デッキ</span><span class="bar"></span>'));
  scroll.appendChild(renderDeckList(draft.deck.filter(i => generated.indexOf(i) < 0), {}));

  s.appendChild(scroll);

  const foot = el('div', 'mr-sticky');
  foot.appendChild(btn('この構成で開始', 'primary', () => { startRun(draft); go('MAP'); }));
  foot.appendChild(btn('入力し直す', 'ghost', () => go('EXERCISE')));
  s.appendChild(foot);
  return s;
}


/* --- 戦闘画面 --- */
function renderBattle(){
  if (!G.battle){ go('MAP'); return el('div'); }
  B = G.battle;
  const s = el('div', 'mr-screen mr-battle');

  /* 敵 */
  const et = el('div', 'mr-enemies');
  B.enemies.forEach((e, idx) => { if (e.alive) et.appendChild(renderEnemy(e, idx)); });
  s.appendChild(et);

  /* プレイヤー状態 */
  s.appendChild(renderPlayerStatus());

  /* ログ */
  const logBox = el('div', 'mr-log');
  logBox.innerHTML = B.log.slice(-5).map(l => '<div>' + l + '</div>').join('');
  s.appendChild(logBox);

  s.appendChild(el('div', 'mr-spacer'));

  /* 操作列 */
  const bar = el('div', 'mr-bbar');
  const en = el('div', 'mr-energy' + (B.energy > 0 ? ' on' : ''));
  en.innerHTML = '<b>' + B.energy + '</b>/' + B.maxEnergy;
  bar.appendChild(en);
  bar.appendChild(el('div', 'mr-pile', '山札 ' + B.drawPile.length));
  bar.appendChild(el('div', 'mr-pile', '捨札 ' + B.discardPile.length));
  if (B.exhaustPile.length) bar.appendChild(el('div', 'mr-pile', '除外 ' + B.exhaustPile.length));
  bar.appendChild(el('div', 'mr-spacer'));
  const endBtn = el('button', 'mr-btn small ' + (B.phase === 'PLAYER' ? 'primary' : ''),
                    B.phase === 'PLAYER' ? 'ターン終了' : '敵のターン…');
  endBtn.disabled = B.phase !== 'PLAYER';
  endBtn.addEventListener('click', endPlayerTurn);
  bar.appendChild(endBtn);
  s.appendChild(bar);

  if (B.selecting != null) s.appendChild(el('div', 'mr-hint', '↑ 対象の敵を選んでください(もう一度カードを押すとキャンセル)'));

  /* 手札 */
  const hand = el('div', 'mr-hand');
  B.hand.forEach((inst, i) => {
    const card = effectiveCard(inst);
    const playable = canPlay(inst);
    const node = renderCardEl(inst, {
      cost: cardCost(card),
      text: cardDisplayText(inst),
      playable: playable,
      disabled: !playable,
      onClick: () => onHandCardClick(i),
    });
    if (B.selecting === i) node.classList.add('selected');
    hand.appendChild(node);
  });
  if (!B.hand.length) hand.appendChild(el('div', 'mr-note', '手札なし'));
  s.appendChild(hand);

  return s;
}

function renderEnemy(e, idx){
  const n = el('div', 'mr-enemy' + (B.selecting != null ? ' targetable' : ''));
  n.appendChild(el('div', 'eintent', intentText(e)));
  n.appendChild(el('div', 'ename', e.name));
  const bar = el('div', 'mr-bar');
  const fill = el('div', 'fill');
  fill.style.width = Math.max(0, (e.hp / e.maxHp) * 100) + '%';
  bar.appendChild(fill);
  bar.appendChild(el('span', 'barlabel', e.hp + ' / ' + e.maxHp));
  n.appendChild(bar);
  const row = el('div', 'estat');
  if (e.block > 0) row.appendChild(el('span', 'sblock', '🛡' + e.block));
  for (const k of ['weak','vulnerable','bleed','strength']){
    if (e.status[k] > 0) row.appendChild(el('span', 'stag ' + k,
      STATUS_ICON[k] + e.status[k]));
  }
  n.appendChild(row);
  if (B.selecting != null){
    n.addEventListener('click', () => playCard(B.selecting, idx));
  }
  return n;
}

function intentText(e){
  const act = e.intent;
  if (!act) return '';
  const d = DIFFICULTY[G.run.difficulty];
  if (act.intent === 'attack'){
    const dmg = calcDamage(Math.floor(act.value * d.enemyDmgMult), e, playerActor(), {});
    return INTENT_ICON.attack + ' ' + dmg + (act.times > 1 ? '×' + act.times : '');
  }
  if (act.intent === 'block') return INTENT_ICON.block + ' ' + act.value;
  if (act.intent === 'heal')  return INTENT_ICON.heal  + ' ' + act.value;
  if (act.intent === 'buff')  return INTENT_ICON.buff;
  if (act.intent === 'debuff')return INTENT_ICON.debuff;
  return '';
}

function renderPlayerStatus(){
  const p = el('div', 'mr-pstat');
  const bar = el('div', 'mr-bar hp');
  const fill = el('div', 'fill');
  fill.style.width = Math.max(0, (G.run.hp / G.run.maxHp) * 100) + '%';
  bar.appendChild(fill);
  bar.appendChild(el('span', 'barlabel', '❤ ' + G.run.hp + ' / ' + G.run.maxHp));
  p.appendChild(bar);

  const row = el('div', 'estat');
  if (B.block > 0)  row.appendChild(el('span', 'sblock', '🛡' + B.block + (B.keepBlock ? '*' : '')));
  if (B.evade > 0)  row.appendChild(el('span', 'stag evade', '💨' + B.evade));
  if (B.counter > 0)row.appendChild(el('span', 'stag counter', '↩' + B.counter));
  for (const k of ['weak','vulnerable','strength']){
    if (B.status[k] > 0) row.appendChild(el('span', 'stag ' + k, STATUS_ICON[k] + B.status[k]));
  }
  for (const bp of B.blockPerTurn){
    row.appendChild(el('span', 'stag', '🛡/T ' + bp.value
      + (bp.turnsLeft === Infinity ? '' : '(' + bp.turnsLeft + ')')));
  }
  // 場のPower
  const powerCount = {};
  for (const p2 of B.powers) powerCount[p2.id] = (powerCount[p2.id] || 0) + 1;
  for (const id in powerCount){
    row.appendChild(el('span', 'stag power',
      CARDS[id].name + (powerCount[id] > 1 ? '×' + powerCount[id] : '')));
  }
  if (row.childNodes.length) p.appendChild(row);
  p.appendChild(el('div', 'mr-note', 'ターン ' + B.turn));
  return p;
}

/** 現在の状態を反映したカードテキスト(Phase 3 で条件付きカードに拡張) */
function cardDisplayText(inst){
  return effectiveCard(inst).text;
}

function onHandCardClick(i){
  const inst = B.hand[i];
  if (!inst || !canPlay(inst)) return;
  const card = effectiveCard(inst);
  const alive = livingEnemies();
  if (card.target === 'single' && alive.length > 1){
    B.selecting = (B.selecting === i) ? null : i;
    render();
    return;
  }
  const idx = B.enemies.findIndex(e => e.alive);
  playCard(i, idx);
}

/* --- 戦闘後の暫定画面(Phase 6 で本実装) --- */
function renderBattleResult(win){
  const s = el('div', 'mr-screen');
  const ph = el('div', 'mr-placeholder');
  ph.appendChild(el('div', 'mr-title', win ? '戦闘に勝利' : '敗北'));
  ph.appendChild(el('div', 'mr-sub', win ? '報酬画面は Phase 6 で実装' : 'Phase 6 で実装'));
  if (G.battle){
    ph.appendChild(el('div', 'mr-note',
      'ターン ' + G.battle.turn + ' / 残HP ' + G.run.hp + '/' + G.run.maxHp));
  }
  s.appendChild(ph);
  if (win){
    s.appendChild(btn('マップへ戻る', 'primary', () => { G.battle = null; B = null; saveGame(); go('MAP'); }));
  } else {
    s.appendChild(btn('タイトルへ', 'primary', () => {
      G.battle = null; B = null; G.run = null; saveGame(); go('TITLE');
    }));
  }
  return s;
}

/* --- マップ(Phase 5 で本実装。今はテスト戦闘の入口) --- */
function renderMapTemp(){
  const s = el('div', 'mr-screen');
  const ph = el('div', 'mr-placeholder');
  ph.appendChild(el('div', 'mr-title', 'マップ'));
  ph.appendChild(el('div', 'mr-sub', 'Phase 5 で実装'));
  s.appendChild(ph);
  s.appendChild(btn('テスト戦闘(スライムモドキ)', 'primary', () => startBattle(['slime_fake'])));
  s.appendChild(btn('テスト戦闘(スライム×2)', '', () => startBattle(['slime_fake','slime_fake'])));
  s.appendChild(btn('タイトルへ戻る', 'ghost', () => go('TITLE')));
  return [renderHud(), s];
}

const RENDERERS = {
  TITLE: renderTitle,
  DIFFICULTY: renderDifficulty,
  EXERCISE: renderExercise,
  DECK_PREVIEW: renderDeckPreview,
  MAP: renderMapTemp,
  BATTLE: renderBattle,
  REWARD: () => renderBattleResult(true),
  GAMEOVER: () => renderBattleResult(false),
};

/* --- デバッグパネル --- */
function renderDebugPanel(){
  const p = el('div', 'mr-debug');
  p.appendChild(el('div', 't', 'DEBUG'));
  const sel = el('select');
  sel.style.cssText = 'font:inherit;font-size:12px;background:#1e222c;color:#e8ecf2;border:1px solid #444;border-radius:5px;padding:3px';
  for (const s of SCREENS){
    const o = el('option'); o.value = s; o.textContent = s;
    if (s === G.screen) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => go(sel.value));
  p.appendChild(sel);
  p.appendChild(btn('ダミーrun生成', 'small', () => {
    G.run = makeDummyRun();
    saveGame(); render();
  }));
  p.appendChild(btn('セーブ削除', 'small', () => { resetSave(); render(); }));
  if (G.battle && G.battle.phase === 'PLAYER'){
    p.appendChild(el('div', 't', 'BATTLE'));
    p.appendChild(btn('敵HP1', 'small', () => {
      for (const e of G.battle.enemies) if (e.alive) e.hp = 1;
      render();
    }));
    p.appendChild(btn('Energy+10', 'small', () => { G.battle.energy += 10; render(); }));
    p.appendChild(btn('1枚引く', 'small', () => { drawCard(1); render(); }));
    p.appendChild(btn('勝利', 'small', () => {
      for (const e of G.battle.enemies){ e.hp = 0; e.alive = false; }
      checkBattleEnd(); render();
    }));
  }
  return p;
}

function makeDummyRun(){
  const d = DIFFICULTY.NORMAL;
  return {
    difficulty: 'NORMAL',
    hp: d.playerMaxHp, maxHp: d.playerMaxHp, gold: 99,
    deck: STARTING_DECK.map(id => newCardInstance(id, false)),
    relics: [], map: null, currentRow: -1, currentCol: null, visited: [],
    exercise: { pushup:0, jumpSquat:0, twistLegRaise:0, plankSeconds:0 },
    seenEvents: [], removeCost: 75,
  };
}


/* ===== SECTION: BOOT ===== */
function boot(){
  loadGame();
  // 復元した run のカード uid と採番カウンタが衝突しないようにする
  if (G.run && Array.isArray(G.run.deck)){
    for (const c of G.run.deck) if (c && c.uid >= _uid) _uid = c.uid + 1;
  }
  render();
}
boot();

/* 開発用にグローバル公開(デバッグコンソールから触れるように) */
window.MROG = { G, CARDS, CARD_LIST, ENEMIES, RELICS, DIFFICULTY, NODE_WEIGHTS,
  saveGame, loadGame, resetSave, go, render, effectiveCard,
  normalizeExercise, toCount, cardsFromCount, coresFromCount, coresGained,
  rollRarity, rollCardOf, buildDeck, startRun, newDraft,
  startBattle, playCard, endPlayerTurn, drawCard, calcDamage, gainBlock,
  get battle(){ return G.battle; } };
</script>
