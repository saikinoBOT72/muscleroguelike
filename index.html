/* --- マップ画面 --- */
const MAP_ROW_H = 92;

function renderMap(){
  const run = G.run;
  if (!run){ go('TITLE'); return el('div'); }
  if (!run.map) run.map = generateMap(run.difficulty);

  const s = el('div', 'mr-screen mr-mapscreen');
  const selectable = selectableNodes();
  const selSet = new Set(selectable.map(n => nodeKey(n.row, n.col)));
  const cur = currentNode();

  const head = el('div', 'mr-maphead');
  head.innerHTML = run.currentRow < 0
    ? '<b>出発地点を選んでください</b>'
    : (run.currentRow >= BOSS_ROW ? '<b>ボスを撃破した</b>'
       : 'Row ' + run.currentRow + ' / ' + (BOSS_ROW) + ' — 次に進む場所を選んでください');
  s.appendChild(head);

  const scroller = el('div', 'mr-mapscroll');
  const wrap = el('div', 'mr-mapwrap');
  wrap.style.height = (MAP_ROWS * MAP_ROW_H) + 'px';

  const yOf = (r) => ((BOSS_ROW - r) + 0.5) * MAP_ROW_H;
  const xOf = (c, r) => (r === BOSS_ROW ? '50%' : ((c + 0.5) / MAP_COLS * 100) + '%');

  /* 辺 */
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'mr-mapedges');
  for (let r = 0; r < BOSS_ROW; r++){
    for (let c = 0; c < MAP_COLS; c++){
      const n = run.map.rows[r][c];
      if (!n) continue;
      for (const nc of n.next){
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', xOf(c, r));      line.setAttribute('y1', yOf(r));
        line.setAttribute('x2', xOf(nc, r + 1)); line.setAttribute('y2', yOf(r + 1));
        const active = cur && cur.row === r && cur.col === c && selSet.has(nodeKey(r + 1, nc));
        line.setAttribute('class', 'edge' + (active ? ' active' : ''));
        svg.appendChild(line);
      }
    }
  }
  wrap.appendChild(svg);

  /* ノード */
  for (let r = 0; r <= BOSS_ROW; r++){
    for (let c = 0; c < MAP_COLS; c++){
      const n = run.map.rows[r][c];
      if (!n) continue;
      const key = nodeKey(r, c);
      const isCur = cur === n;
      const isSel = selSet.has(key);
      const visited = run.visited.indexOf(key) >= 0;
      const node = el('div', 'mr-node t-' + n.type
        + (isSel ? ' selectable' : '') + (isCur ? ' current' : '') + (visited ? ' visited' : ''));
      node.style.left = xOf(c, r);
      node.style.top  = (yOf(r) - 23) + 'px';
      node.appendChild(el('span', 'icon', NODE_ICON[n.type]));
      if (visited && !isCur) node.appendChild(el('span', 'check', '✓'));
      const label = el('div', 'nlabel', NODE_LABEL[n.type]);
      node.appendChild(label);
      if (isSel) node.addEventListener('click', () => enterNode(n));
      wrap.appendChild(node);
    }
  }

  scroller.appendChild(wrap);
  s.appendChild(scroller);

  /* 凡例 */
  const legend = el('div', 'mr-legend');
  for (const t of ['COMBAT','ELITE','EVENT','REST','SHOP','TREASURE','BOSS'])
    legend.appendChild(el('span', '', NODE_ICON[t] + ' ' + NODE_LABEL[t]));
  s.appendChild(legend);

  // 現在地までスクロール(最初は一番下=Row0)
  setTimeout(() => {
    const target = run.currentRow < 0 ? MAP_ROWS * MAP_ROW_H
                 : (BOSS_ROW - run.currentRow + 1.5) * MAP_ROW_H;
    scroller.scrollTop = Math.max(0, target - scroller.clientHeight);
  }, 0);

  return [renderHud(), s];
}

const RENDERERS = {
  TITLE: renderTitle,
  DIFFICULTY: renderDifficulty,
  EXERCISE: renderExercise,
  DECK_PREVIEW: renderDeckPreview,
  MAP: renderMap,
  BATTLE: renderBattle,
  REWARD:   renderReward,
  VICTORY:  function(){ return renderRunEnd(true); },
  GAMEOVER: function(){ return renderRunEnd(false); },
  SHOP:     renderShop,
  REST:     renderRest,
  EVENT:    renderEvent,
  TREASURE: renderTreasure,
};

// 画面と描画関数の対応漏れを起動時に検出する
for (const k in RENDERERS){
  if (SCREENS.indexOf(k) < 0) throw new Error('RENDERERS に未知の画面: ' + k);
  if (typeof RENDERERS[k] !== 'function') throw new Error('RENDERERS[' + k + '] が関数でない');
}

    const o0 = el('option'); o0.value = ''; o0.textContent = '手札に加える…'; cs.appendChild(o0);
    for (const c of CARD_LIST){
      const o = el('option'); o.value = c.id; o.textContent = CAT_LABEL[c.cat] + ' ' + c.name;
      cs.appendChild(o);
    }
    cs.addEventListener('change', () => {
      if (!cs.value) return;
      G.battle.hand.push(newCardInstance(cs.value, false));
      cs.value = ''; render();
    });
    p.appendChild(cs);
  }
  return p;
}

function makeDummyRun(){
  const d = DIFFICULTY.NORMAL;
  return {
    difficulty: 'NORMAL',
    hp: d.playerMaxHp, maxHp: d.playerMaxHp, gold: 99,
    deck: STARTING_DECK.map(id => newCardInstance(id, false)),
    relics: [], map: null, currentRow: -1, currentCol: null, visited: [],
    exercise: { pushup:0, jumpSquat:0, twistLegRaise:0, plankSeconds:0 },
    seenEvents: [], removeCost: 75
  };
}


/* ===== SECTION: BOOT ===== */
function boot(){
  loadGame();
  // 復元した run のカード uid と採番カウンタが衝突しないようにする
  if (G.run && Array.isArray(G.run.deck)){
    for (const c of G.run.deck) if (c && c.uid >= _uid) _uid = c.uid + 1;
  }
  render();
}
boot();
