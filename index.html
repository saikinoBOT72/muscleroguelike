/* ===== SECTION: UTIL ===== */
const rnd   = (n) => Math.floor(Math.random() * n);
const pick  = (arr) => arr[rnd(arr.length)];
const range = (min, max) => min + rnd(max - min + 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** entries: [{v, w}] → w の重みで v を1つ返す */
function weightedPick(entries){
  let total = 0;
  for (const e of entries) total += e.w;
  if (total <= 0) return entries.length ? entries[0].v : null;
  let r = Math.random() * total;
  for (const e of entries){ r -= e.w; if (r < 0) return e.v; }
  return entries[entries.length - 1].v;
}

function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function btn(label, cls, onClick){
  const b = el('button', 'mr-btn ' + (cls || ''), label);

const ENEMIES = {};
for (const e of ENEMY_LIST) ENEMIES[e.id] = e;

/* --- レリック(効果の実装は Phase 7) --- */
const RELIC_LIST = [
{ id:'rel_training_proof',    name:'鍛錬の証',       icon:'🏅', desc:'戦闘開始時、力+1' },
{ id:'rel_unyielding_plate',  name:'不屈のプレート', icon:'🛡', desc:'戦闘開始時、ブロック+5' },
{ id:'rel_accelerator',       name:'加速装置',       icon:'⚡', desc:'戦闘の最初のターンのみ Energy+1' },
{ id:'rel_grudge_record',     name:'執念の記録',     icon:'📕', desc:'出血によるダメージ+50%' },
{ id:'rel_battle_wisdom',     name:'継戦の心得',     icon:'📜', desc:'POWERカードのコスト-1(最低0)' },
{ id:'rel_sweat_crystal',     name:'汗の結晶',       icon:'💧', desc:'戦闘勝利時、ゴールド+10' },
];
const RELICS = {};
for (const r of RELIC_LIST) RELICS[r.id] = r;

/* 初期から出現するレリック(残りは Phase 8 でアンロック) */
const STARTER_RELICS = ['rel_training_proof','rel_unyielding_plate','rel_accelerator'];

/* --- 難易度 --- */
const DIFFICULTY = {
  NORMAL: { key:'NORMAL', label:'ふつう', playerMaxHp:70,
            enemyHpMult:1.0,  enemyDmgMult:1.0,
            enemyStartStrength:{ NORMAL:0, ELITE:0, BOSS:0 },
            shopPriceMult:1.0, restHealRate:0.30, bossPhase2:0.50,
            goldMult:1.0, coreMult:1.0, rareWeightBonus:0 },
  HARD:   { key:'HARD',   label:'むずい', playerMaxHp:60,
            enemyHpMult:1.25, enemyDmgMult:1.25,
            enemyStartStrength:{ NORMAL:1, ELITE:2, BOSS:2 },
            shopPriceMult:1.25, restHealRate:0.20, bossPhase2:0.60,
            goldMult:1.2, coreMult:1.2, rareWeightBonus:3 },
};

/* --- マップのノード出現重み(Phase 5) --- */
const NODE_WEIGHTS = {
  NORMAL: [{v:'COMBAT',w:45},{v:'EVENT',w:22},{v:'REST',w:12},
           {v:'SHOP',w:8},{v:'ELITE',w:8},{v:'TREASURE',w:5}],
  HARD:   [{v:'COMBAT',w:48},{v:'EVENT',w:20},{v:'REST',w:8},
           {v:'SHOP',w:7},{v:'ELITE',w:13},{v:'TREASURE',w:4}],
};

/* --- 初期デッキ --- */
const STARTING_DECK = [
  'atk_punch','atk_punch','atk_punch',
  'pwr_guard','pwr_guard','pwr_guard',
  'skl_sidestep','dbf_feint',
];


/* ===== SECTION: STATE ===== */
const SAVE_KEY = 'mrog_save_v1';

function newMeta(){
  return {
    cores: { chest:0, leg:0, twist:0, core:0 },
    unlocked: [],
    upgradedBasics: [],
    unlockedRelics: [],
    clearedNormal: false,
    clearedHard: false,
    lastPlayDate: null,
  };
}

const G = {
  screen: 'TITLE',
  meta: newMeta(),
  run: null,
  battle: null,
};

function saveGame(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ meta:G.meta, run:G.run }));
  } catch (err) {
    console.warn('セーブに失敗しました', err);
  }
}

function loadGame(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (err) { return; }
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); }
  catch (err) {
    console.info('セーブデータが壊れていたため破棄しました');
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    return;
  }
  if (!data || typeof data !== 'object') return;
  G.meta = Object.assign(newMeta(), data.meta || {});
  G.meta.cores = Object.assign({ chest:0, leg:0, twist:0, core:0 }, G.meta.cores || {});
  G.run = data.run || null;
}

function resetSave(){
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  G.meta = newMeta();
  G.run = null;
  G.battle = null;
}

/* カードインスタンス(uid で個体を識別する) */
let _uid = 1;
function newCardInstance(id, upgraded){
  return { uid: _uid++, id: id, upgraded: !!upgraded };
}
/** upgraded を反映した実効カード定義を返す */
function effectiveCard(inst){
  const base = CARDS[inst.id];
  if (!base) throw new Error('未知のカードID: ' + inst.id);
  if (!inst.upgraded || !base.up) return base;
  return Object.assign({}, base, base.up, { name: base.name + '+' });
}


/* ===== SECTION: SCREENS ===== */
const SCREENS = ['TITLE','DIFFICULTY','EXERCISE','DECK_PREVIEW','MAP','BATTLE','REWARD',
                 'SHOP','REST','EVENT','TREASURE','META','GAMEOVER','VICTORY'];

function go(screen){
  if (!SCREENS.includes(screen)) throw new Error('未知の画面: ' + screen);
  G.screen = screen;
  render();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const fn = RENDERERS[G.screen] || renderPlaceholder;
  const nodes = fn();
  for (const n of (Array.isArray(nodes) ? nodes : [nodes])) if (n) app.appendChild(n);
  if (DEBUG) app.appendChild(renderDebugPanel());
}

/* --- 共通パーツ --- */

/** ラン中の画面で使い回すヘッダ */
function renderHud(){
  const r = G.run;
  if (!r) return null;
  const hud = el('div', 'mr-hud');
  hud.appendChild(el('span', 'chip', '❤ <span class="hpv">' + r.hp + '</span>/' + r.maxHp));
  hud.appendChild(el('span', 'chip', '💰 <span class="goldv">' + r.gold + '</span>'));
  const relics = el('span', 'chip');
  relics.textContent = r.relics.length
    ? r.relics.map(id => (RELICS[id] ? RELICS[id].icon : '?')).join(' ')
    : '—';
  relics.title = r.relics.map(id => RELICS[id] && RELICS[id].name).join(' / ');
  hud.appendChild(relics);
  hud.appendChild(el('span', 'mr-spacer'));
  const d = DIFFICULTY[r.difficulty];
  hud.appendChild(el('span', 'mr-badge' + (r.difficulty === 'HARD' ? ' hard' : ''), d.label));
  return hud;
}

/** カード1枚の DOM。opts: {playable, disabled, onClick, showCost} */
function renderCardEl(inst, opts){
  opts = opts || {};
  const c = effectiveCard(inst);
  const cls = ['mr-card', 'cat-' + c.cat, 'rar-' + c.rarity];
  if (inst.upgraded) cls.push('upgraded');
  if (opts.playable) cls.push('playable');
  if (opts.disabled) cls.push('disabled');
  const node = el('div', cls.join(' '));
  if (opts.showCost !== false){
    node.appendChild(el('div', 'ccost', String(opts.cost != null ? opts.cost : c.cost)));
  }
  node.appendChild(el('div', 'cname', c.name));
  node.appendChild(el('div', 'ctext', opts.text != null ? opts.text : c.text));
  node.appendChild(el('div', 'ctag', CAT_LABEL[c.cat] + ' / ' + RARITY_LABEL[c.rarity]));
  if (opts.onClick && !opts.disabled) node.addEventListener('click', () => opts.onClick(inst));
  return node;
}

/** カードのグリッド表示 */
function renderDeckList(cards, opts){
  const grid = el('div', 'mr-grid');
  for (const inst of cards) grid.appendChild(renderCardEl(inst, opts));
  return grid;
}

function renderCores(cores){
  const wrap = el('div', 'mr-cores');
  for (const ex of EXERCISES){
    const c = el('div', 'mr-core ' + ex.core);
    c.appendChild(el('div', 'n', String(cores[ex.core] || 0)));
    c.appendChild(el('div', 'l', ex.coreLabel));
    wrap.appendChild(c);
  }
  return wrap;
}

/* --- タイトル --- */
function renderTitle(){
  const s = el('div', 'mr-screen');
  const head = el('div', 'mr-center');
  head.appendChild(el('h1', 'mr-title', '筋トレ融合<br>ローグライク'));
  head.appendChild(el('p', 'mr-sub', 'その日の筋トレが、そのままデッキになる。'));
  s.appendChild(head);

  const panel = el('div', 'mr-panel');
  panel.appendChild(el('div', 'mr-note', '所持している筋力コア'));
  panel.appendChild(renderCores(G.meta.cores));
  s.appendChild(panel);

  if (G.run){
    s.appendChild(btn('冒険を再開する', 'primary', () => go('MAP')));
    s.appendChild(btn('ランを破棄して最初から', 'ghost', () => {
      if (!confirm('進行中のランを破棄しますか?')) return;
      G.run = null; saveGame(); render();
    }));
  } else {
    s.appendChild(btn('ラン開始', 'primary', () => go('DIFFICULTY')));
  }
  s.appendChild(btn('強化所', '', () => go('META')));

  s.appendChild(el('div', 'mr-spacer'));
  const foot = el('div', 'mr-note mr-center');
  foot.innerHTML = 'Phase 0 — 土台・データ定義・画面遷移・セーブ<br>'
    + 'カード ' + Object.keys(CARDS).length + '種 / 敵 ' + Object.keys(ENEMIES).length + '種 / レリック '
    + Object.keys(RELICS).length + '種';
  s.appendChild(foot);
  return s;
}

/* --- 未実装画面の受け皿 --- */
const PLACEHOLDER_INFO = {
  DIFFICULTY:   ['難易度選択',   'Phase 1 で実装'],
  EXERCISE:     ['運動記録の入力','Phase 1 で実装'],
  DECK_PREVIEW: ['デッキ確認',   'Phase 1 で実装'],
  MAP:          ['マップ',       'Phase 5 で実装'],
  BATTLE:       ['戦闘',         'Phase 2 で実装'],
  REWARD:       ['戦闘報酬',     'Phase 6 で実装'],
  SHOP:         ['ショップ',     'Phase 6 で実装'],
  REST:         ['休憩所',       'Phase 6 で実装'],
  EVENT:        ['イベント',     'Phase 6 で実装'],
  TREASURE:     ['宝箱',         'Phase 6 で実装'],
  META:         ['強化所',       'Phase 8 で実装'],
  GAMEOVER:     ['敗北',         'Phase 6 で実装'],
  VICTORY:      ['制覇',         'Phase 6 で実装'],
};

function renderPlaceholder(){
  const info = PLACEHOLDER_INFO[G.screen] || [G.screen, ''];
  const s = el('div', 'mr-screen');
  const hud = renderHud();
  const ph = el('div', 'mr-placeholder');
  ph.appendChild(el('div', 'mr-title', info[0]));
  ph.appendChild(el('div', 'mr-sub', info[1]));
  s.appendChild(ph);
  s.appendChild(btn('タイトルへ戻る', 'ghost', () => go('TITLE')));
  return hud ? [hud, s] : s;
}

const RENDERERS = { TITLE: renderTitle };

/* --- デバッグパネル --- */
function renderDebugPanel(){
  const p = el('div', 'mr-debug');
  p.appendChild(el('div', 't', 'DEBUG'));
  const sel = el('select');
  sel.style.cssText = 'font:inherit;font-size:12px;background:#1e222c;color:#e8ecf2;border:1px solid #444;border-radius:5px;padding:3px';
  for (const s of SCREENS){
    const o = el('option'); o.value = s; o.textContent = s;
    if (s === G.screen) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => go(sel.value));
  p.appendChild(sel);
  p.appendChild(btn('ダミーrun生成', 'small', () => {
    G.run = makeDummyRun();
    saveGame(); render();
  }));
  p.appendChild(btn('セーブ削除', 'small', () => { resetSave(); render(); }));
  return p;
}

function makeDummyRun(){
  const d = DIFFICULTY.NORMAL;
  return {
    difficulty: 'NORMAL',
    hp: d.playerMaxHp, maxHp: d.playerMaxHp, gold: 99,
    deck: STARTING_DECK.map(id => newCardInstance(id, false)),
    relics: [], map: null, currentRow: -1, currentCol: null, visited: [],
    exercise: { pushup:0, jumpSquat:0, twistLegRaise:0, plankSeconds:0 },
    seenEvents: [], removeCost: 75,
  };
}


/* ===== SECTION: BOOT ===== */
function boot(){
  loadGame();
  // 復元した run のカード uid と採番カウンタが衝突しないようにする
  if (G.run && Array.isArray(G.run.deck)){
    for (const c of G.run.deck) if (c && c.uid >= _uid) _uid = c.uid + 1;
  }
  render();
}
boot();

/* 開発用にグローバル公開(デバッグコンソールから触れるように) */
window.MROG = { G, CARDS, ENEMIES, RELICS, DIFFICULTY, NODE_WEIGHTS, saveGame, loadGame, resetSave, go, render };
</script>
