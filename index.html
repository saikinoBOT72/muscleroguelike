<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレローグライク</title>
<style>
/* ===== SECTION: STYLE ===== */
:root{
  --bg:#14161c; --panel:#1e222c; --panel2:#252a36; --line:#333a48;
  --text:#e8ecf2; --dim:#8b93a5;
  --atk:#e2574c; --skl:#4caf7d; --dbf:#a86fd6; --pwr:#4a90d9;
  --hp:#d0453c; --block:#5a9fd4; --energy:#e8c34a; --gold:#e8c34a;
  --rare:#e8c34a; --uncommon:#5a9fd4; --common:#8b93a5; --basic:#5c6474;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.6; overscroll-behavior:none;
}
#app{max-width:480px;margin:0 auto;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.mr-screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:16px;gap:14px}
.mr-title{font-size:22px;font-weight:700;letter-spacing:.04em;margin:0}
.mr-sub{color:var(--dim);font-size:13px;margin:0}
.mr-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.mr-row{display:flex;gap:8px;align-items:center}
.mr-spacer{flex:1}
.mr-center{text-align:center}

.mr-btn{
  appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;font-weight:600;padding:12px 16px;border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .06s;width:100%;
}
.mr-btn:hover:not(:disabled){background:#2e3444;border-color:#4a5468}
.mr-btn:active:not(:disabled){transform:translateY(1px)}
.mr-btn:disabled{opacity:.4;cursor:default}
.mr-btn.primary{background:linear-gradient(180deg,#3a6ea8,#2f5a8a);border-color:#4a80bd}
.mr-btn.primary:hover{background:linear-gradient(180deg,#4479b6,#356397)}
.mr-btn.ghost{background:transparent}
.mr-btn.small{padding:8px 12px;font-size:13px;width:auto}

/* HUD */
.mr-hud{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;
}
.mr-hud .chip{display:flex;align-items:center;gap:4px;white-space:nowrap}
.mr-hud .hpv{color:var(--hp);font-weight:700}
.mr-hud .goldv{color:var(--gold);font-weight:700}
.mr-badge{
  font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);
}
.mr-badge.hard{color:#f0a04a;border-color:#7a5a30;background:#2a2018}

/* コア表示 */
.mr-cores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mr-core{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.mr-core .n{font-size:20px;font-weight:700;line-height:1.2}
.mr-core .l{font-size:11px;color:var(--dim)}
.mr-core.chest .n{color:var(--atk)} .mr-core.leg .n{color:var(--skl)}
.mr-core.twist .n{color:var(--dbf)} .mr-core.core .n{color:var(--pwr)}

/* カード */
.mr-card{
  position:relative;width:104px;min-height:146px;border-radius:9px;padding:8px;
  background:linear-gradient(180deg,var(--panel2),#1a1e28);
  border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;
  font-size:11px;line-height:1.4;cursor:default;flex:0 0 auto;
}
.mr-card .cname{font-size:12px;font-weight:700;line-height:1.25;padding-left:19px;min-height:15px}
.mr-card .ctext{color:#cfd6e2;flex:1}
.mr-card .ccost{
  position:absolute;top:-6px;left:-6px;width:23px;height:23px;border-radius:50%;
  background:var(--energy);color:#241d05;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;border:2px solid #14161c;
}
.mr-card .ctag{font-size:10px;color:var(--dim);letter-spacing:.04em}
.mr-card.cat-ATTACK{border-color:var(--atk)} .mr-card.cat-SKILL{border-color:var(--skl)}
.mr-card.cat-DEBUFF{border-color:var(--dbf)} .mr-card.cat-POWER{border-color:var(--pwr)}
.mr-card.rar-RARE{box-shadow:0 0 0 1px var(--rare) inset}
.mr-card.upgraded .cname{color:var(--rare)}
.mr-card.playable{cursor:pointer}
.mr-card.playable:hover{transform:translateY(-4px);transition:transform .1s}
.mr-card.disabled{opacity:.45}
.mr-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.mr-note{color:var(--dim);font-size:12px}
.mr-hr{height:1px;background:var(--line);border:0;margin:4px 0}
.mr-placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--dim);text-align:center;
}
.mr-debug{
  position:fixed;right:8px;bottom:8px;z-index:99;background:#2a1a1a;border:1px solid #6a3a3a;
  border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;max-width:170px;
}

/* 難易度選択 */
.mr-diff{display:flex;flex-direction:column;gap:10px}
.mr-diffbtn{
  text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;padding:14px;border-radius:10px;cursor:pointer;transition:border-color .12s,background .12s;
}
.mr-diffbtn:hover{background:#2e3444}
.mr-diffbtn .dn{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.mr-diffbtn .dd{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
.mr-diffbtn.normal{border-color:#3f6b93} .mr-diffbtn.normal .dn{color:#7fb6e6}
.mr-diffbtn.hard{border-color:#8a5a2a}   .mr-diffbtn.hard   .dn{color:#f0a04a}

/* 運動入力 */
.mr-ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mr-ex .exhead{display:flex;align-items:baseline;gap:8px}
.mr-ex .exname{font-weight:700;font-size:14px}
.mr-ex .excat{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.mr-ex.cat-ATTACK .excat{color:var(--atk);border-color:var(--atk)}
.mr-ex.cat-SKILL  .excat{color:var(--skl);border-color:var(--skl)}
.mr-ex.cat-DEBUFF .excat{color:var(--dbf);border-color:var(--dbf)}
.mr-ex.cat-POWER  .excat{color:var(--pwr);border-color:var(--pwr)}
.mr-ex .exinput{display:flex;gap:6px;align-items:center}
.mr-ex input[type=number]{
  flex:1;min-width:0;font:inherit;font-size:19px;font-weight:700;text-align:center;
  background:#12151b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 4px;
}
.mr-ex input[type=number]::-webkit-outer-spin-button,
.mr-ex input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mr-ex input[type=number]{-moz-appearance:textfield}
.mr-step{
  font:inherit;font-size:12px;font-weight:700;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:7px;padding:8px 0;cursor:pointer;min-width:38px;
}
.mr-step:hover{background:#2e3444}
.mr-ex .exout{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.mr-ex .exout b{color:var(--text)}
.mr-ex .exout .zero{color:#6a7183}

.mr-table{width:100%;border-collapse:collapse;font-size:12px}
.mr-table th,.mr-table td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
.mr-table th:first-child,.mr-table td:first-child{text-align:left}
.mr-table th{color:var(--dim);font-weight:600}
.mr-table td b{font-size:14px}

.mr-cathead{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:2px 0;
}
.mr-cathead .bar{flex:1;height:1px;background:var(--line)}
.mr-cathead.ATTACK{color:var(--atk)} .mr-cathead.SKILL{color:var(--skl)}
.mr-cathead.DEBUFF{color:var(--dbf)} .mr-cathead.POWER{color:var(--pwr)}
.mr-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.mr-sticky{flex:0 0 auto;background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}

/* 戦闘 */
.mr-battle{gap:10px;padding:12px}
.mr-enemies{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:6px}
.mr-enemy{
  background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px;
  min-width:132px;max-width:190px;flex:1 1 auto;display:flex;flex-direction:column;gap:6px;
}
.mr-enemy.targetable{border-color:var(--atk);cursor:pointer;box-shadow:0 0 12px rgba(226,87,76,.35)}
.mr-enemy.targetable:hover{background:#2a1f22}
.mr-enemy .eintent{font-size:15px;font-weight:800;color:#ffb4ac;min-height:22px;text-align:center}
.mr-enemy .ename{font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.mr-bar{position:relative;height:16px;background:#0f1218;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mr-bar .fill{height:100%;background:linear-gradient(180deg,#e2574c,#a63a32);transition:width .18s}
.mr-bar.hp .fill{background:linear-gradient(180deg,#d0453c,#8e2f28)}
.mr-bar .barlabel{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);
}
.estat{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:0}
.estat span{font-size:11px;padding:1px 6px;border-radius:99px;background:#161a22;border:1px solid var(--line)}
.estat .sblock{color:var(--block);border-color:#3b6d96}
.estat .weak{color:#9ad0ff} .estat .vulnerable{color:#ffa0a0}
.estat .bleed{color:#ff7b7b} .estat .strength{color:#ffcf6b}
.estat .evade{color:#8fe0b6} .estat .counter{color:#d6a0f0}
.estat .power{color:var(--pwr);border-color:#3b6d96}

.mr-enemy.dead{animation:mrDie .34s ease forwards;pointer-events:none}
@keyframes mrDie{
  0%{opacity:1}
  100%{opacity:0;transform:scale(.86) translateY(8px)}
}
.mr-enemy.enraged{border-color:#e2574c;box-shadow:0 0 14px rgba(226,87,76,.3)}
.mr-enemy.enraged .ename{color:#ff9a90}
.mr-bar .phasemark{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);transform:translateX(-1px)}
.mr-pstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mr-log{
  background:#10131a;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  font-size:11.5px;color:#a8b0c0;line-height:1.55;max-height:92px;overflow-y:auto;
}
.mr-log div+div{margin-top:1px}
.mr-bbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mr-energy{
  background:#3a3106;border:1.5px solid var(--energy);color:var(--energy);
  border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;
}
.mr-energy b{font-size:17px}
.mr-energy.on{box-shadow:0 0 10px rgba(232,195,74,.3)}
.mr-pile{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.mr-hint{font-size:11.5px;color:#ffb4ac;text-align:center}
.mr-hand{
  display:flex;gap:7px;overflow-x:auto;padding:8px 2px 4px;min-height:160px;align-items:flex-start;
  scrollbar-width:thin;
}
.mr-hand .mr-card{width:98px;min-height:142px}
.mr-card.selected{outline:2px solid var(--energy);outline-offset:2px;transform:translateY(-6px)}

/* マップ */
.mr-mapscreen{padding:10px;gap:8px}
.mr-maphead{font-size:12.5px;color:var(--dim);text-align:center}
.mr-mapscroll{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#10131a}
.mr-mapwrap{position:relative;width:100%}
.mr-mapedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mr-mapedges .edge{stroke:#2c3342;stroke-width:2;stroke-dasharray:4 4}
.mr-mapedges .edge.active{stroke:#6f8fb8;stroke-width:2.5;stroke-dasharray:none}
.mr-node{
  position:absolute;transform:translateX(-50%);width:46px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.mr-node .icon{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:#1a1e27;border:2px solid #2c3342;color:#5f6878;
  transition:transform .12s,box-shadow .12s;
}
.mr-node .nlabel{font-size:9px;color:#5a6474;white-space:nowrap;background:#10131a;padding:0 4px;border-radius:3px}
.mr-node .check{position:absolute;top:-2px;right:-2px;font-size:12px;color:#5fa87a}
.mr-node.visited .icon{border-color:#3a4453;color:#8b93a5;background:#20252f}
.mr-node.current .icon{border-color:var(--text);color:var(--text);box-shadow:0 0 0 3px rgba(232,236,242,.15)}
.mr-node.selectable{cursor:pointer}
.mr-node.selectable .icon{color:#fff;background:#26303f;border-color:#7fb6e6;box-shadow:0 0 14px rgba(127,182,230,.45)}
.mr-node.selectable .nlabel{color:#9fb4cc}
.mr-node.selectable:hover .icon{transform:scale(1.12)}
.mr-node.selectable.t-ELITE .icon{border-color:#e0904a;box-shadow:0 0 14px rgba(224,144,74,.45)}
.mr-node.selectable.t-REST  .icon{border-color:#6fc48d;box-shadow:0 0 14px rgba(111,196,141,.45)}
.mr-node.selectable.t-SHOP  .icon{border-color:#e8c34a;box-shadow:0 0 14px rgba(232,195,74,.4)}
.mr-node.t-BOSS .icon{width:52px;height:52px;font-size:23px}
.mr-node.selectable.t-BOSS .icon{border-color:#e2574c;box-shadow:0 0 18px rgba(226,87,76,.5)}
.mr-legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:10.5px;color:var(--dim)}

/* モーダル / ノード画面 */
.mr-modal{
  position:fixed;inset:0;background:rgba(8,10,14,.82);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.mr-modalbox{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
  width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;gap:10px;
}
.mr-modaltitle{font-size:15px;font-weight:700}
.mr-modallist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px}
.mr-result{border-left:3px solid var(--pwr);color:#cfe0f2}
.mr-warn{background:#2a2018;border:1px solid #7a5a30;color:#f0a04a;border-radius:8px;padding:8px 10px;font-size:12.5px;text-align:center}
.mr-locked{color:#c56a6a;font-size:11px}
.mr-card .cprice{
  position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  background:#3a3106;border:1px solid var(--gold);color:var(--gold);
  border-radius:99px;padding:1px 9px;font-size:10.5px;font-weight:700;white-space:nowrap;
}
.mr-card .cprice.sold{background:#2a2a2a;border-color:#555;color:#888}
.mr-grid{padding-bottom:12px}
.mr-chest{font-size:64px;line-height:1}
.mr-chest.open{animation:mrPop .4s ease}
@keyframes mrPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.mr-btn b{font-weight:700}

/* レリック */
.mr-relics{cursor:pointer;display:flex;gap:3px;align-items:center}
.mr-relics .relic{font-size:15px;line-height:1;display:inline-block;border-radius:50%}
.mr-relics .relic.flash{animation:mrRelic .6s ease}
@keyframes mrRelic{
  0%{transform:scale(1);filter:none}
  35%{transform:scale(1.5);filter:drop-shadow(0 0 8px #ffe9a0)}
  100%{transform:scale(1);filter:none}
}
.mr-toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;
  background:#232936;border:1px solid #4a5468;border-radius:10px;padding:9px 16px;
  font-size:12.5px;text-align:center;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:mrToast 2.6s ease forwards;pointer-events:none;
}
@keyframes mrToast{
  0%{opacity:0;transform:translate(-50%,10px)}
  10%,80%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-6px)}
}
.mr-debug .t{font-size:10px;color:#c88;letter-spacing:.08em}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ===== SECTION: UTIL ===== */
const rnd   = (n) => Math.floor(Math.random() * n);
const pick  = (arr) => arr[rnd(arr.length)];
const range = (min, max) => min + rnd(max - min + 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** entries: [{v, w}] → w の重みで v を1つ返す */
function weightedPick(entries){
  let total = 0;
  for (const e of entries) total += e.w;
  if (total <= 0) return entries.length ? entries[0].v : null;
  let r = Math.random() * total;
  for (const e of entries){ r -= e.w; if (r < 0) return e.v; }
  return entries[entries.length - 1].v;
}

function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function btn(label, cls, onClick){
  const b = el('button', 'mr-btn ' + (cls || ''), label);
  b.addEventListener('click', onClick);
  return b;
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

const DEBUG = new URLSearchParams(location.search).get('debug') === '1';


/* ===== SECTION: DATA ===== */

/* --- カード ---
 * effects の type 一覧(解決処理は Phase 2/3):
 *   damage / damageMulti / block / draw / energy / status / strength /
 *   evade / counter / blockPerTurn / reflect / blockOnPower / blockBonus /
 *   keepBlock / damagePerAttackPlayed / damagePerAttackInHand
 * up は effects を全置換する差分。exhaust を上書きすることもある。
 */
const CARD_LIST = [
/* --- ATTACK(腕立て伏せ / 胸コア) --- */
{ id:'atk_punch', name:'パンチ', cat:'ATTACK', rarity:'BASIC', cost:1, type:'attack', target:'single',
  effects:[{type:'damage',value:6}],
  up:{ effects:[{type:'damage',value:9}] } },

{ id:'atk_double_punch', name:'ダブルパンチ', cat:'ATTACK', rarity:'BASIC', cost:1, type:'attack', target:'single',
  effects:[{type:'damageMulti',value:3,times:2}],
  up:{ effects:[{type:'damageMulti',value:4,times:2}] } },

{ id:'atk_body_blow', name:'ボディブロー', cat:'ATTACK', rarity:'COMMON', cost:1, type:'attack', target:'single',
  effects:[{type:'damage',value:8}],
  up:{ effects:[{type:'damage',value:11}] } },

{ id:'atk_hook', name:'フック', cat:'ATTACK', rarity:'COMMON', cost:1, type:'attack', target:'single',
  effects:[{type:'damage',value:10}],
  up:{ effects:[{type:'damage',value:14}] } },

{ id:'atk_rush', name:'ラッシュ', cat:'ATTACK', rarity:'COMMON', cost:2, type:'attack', target:'single',
  effects:[{type:'damageMulti',value:6,times:2}],
  up:{ effects:[{type:'damageMulti',value:8,times:2}] } },

{ id:'atk_uppercut', name:'アッパーカット', cat:'ATTACK', rarity:'UNCOMMON', cost:2, type:'attack', target:'single',
  effects:[{type:'damage',value:12},{type:'status',key:'weak',value:1}],
  up:{ effects:[{type:'damage',value:16},{type:'status',key:'weak',value:2}] } },

{ id:'atk_barrage', name:'連続殴打', cat:'ATTACK', rarity:'UNCOMMON', cost:2, type:'attack', target:'single',
  effects:[{type:'damageMulti',value:5,times:3}],
  up:{ effects:[{type:'damageMulti',value:7,times:3}] } },

{ id:'atk_heavy_blow', name:'ヘビーブロー', cat:'ATTACK', rarity:'UNCOMMON', cost:2, type:'attack', target:'single',
  exhaust:true, effects:[{type:'damage',value:14}],
  up:{ effects:[{type:'damage',value:18}] } },

{ id:'atk_finish_blow', name:'フィニッシュブロー', cat:'ATTACK', rarity:'RARE', cost:3, type:'attack', target:'single',

 * ctx は書き換え可能(onCardCost の ctx.cost、onBleedDamage の ctx.amount など)。
 */
function fireRelicHook(hookName, ctx){
  ctx = ctx || {};
  if (!G.run) return ctx;
  for (const id of G.run.relics){
    const r = RELICS[id];
    if (!r || !r[hookName]) continue;
    const msg = r[hookName](ctx);
    if (msg){
      relicFlash[id] = Date.now();
      if (G.battle) log('[' + r.name + '] ' + msg);
    }
  }
  return ctx;
}

  let data;
  try { data = JSON.parse(raw); }

  G.meta = Object.assign(newMeta(), data.meta || {});
  G.meta.cores = Object.assign({ chest:0, leg:0, twist:0, core:0 }, G.meta.cores || {});
  G.run = data.run || null;
}

/* カードインスタンス(uid で個体を識別する) */

function newCardInstance(id, upgraded){
  return { uid: _uid++, id: id, upgraded: !!upgraded };
}
/** upgraded を反映した実効カード定義を返す */
function effectiveCard(inst){
  const base = CARDS[inst.id];
  if (!base) throw new Error('未知のカードID: ' + inst.id);
  if (!inst.upgraded || !base.up) return base;
  return Object.assign({}, base, base.up, { name: base.name + '+' });
  // 注意: 非強化時は定義そのものを返すので、呼び出し側でプロパティを書き換えないこと
}

/** カード1種がアンロード済か。Phase 8 でメタ進行に接続する */
function isUnlocked(cardId){
  const c = CARDS[cardId];
  if (!c) return false;
  if (c.rarity === 'BASIC' || c.rarity === 'COMMON') return true;
  return true; // TODO(Phase 8): G.meta.unlocked.includes(cardId) に置き換える
}

/** プランクの秒数を他種目と同じ「回数」に正規化する */
function toCount(exKey, rawValue){
  const v = Math.max(0, Math.floor(rawValue || 0));
  if (exKey === 'plankSeconds') return Math.floor(v / PLANK_SECONDS_PER_COUNT);
  return v;
}

/** 入力値 → カテゴリごとの count */
function normalizeExercise(input){
  const out = {};
  for (const ex of EXERCISES) out[ex.cat] = toCount(ex.key, input[ex.key]);
  return out;
}

/** 回数 → 生成カード枚数(0〜4) */
function cardsFromCount(count){
  return Math.min(Math.floor(Math.sqrt(Math.max(0, count) / 5)), 4);
}

/** 回数 → 獲得筋力コア(0〜5、難易度倍率適用前) */
function coresFromCount(count){
  return Math.min(Math.floor(Math.max(0, count) / 10), 5);
}

/** 難易度倍率まで適用した獲得コア数 */
function coresGained(count, diffKey){
  return Math.floor(coresFromCount(count) * DIFFICULTY[diffKey].coreMult);
}

const RARITY_ORDER = ['RARE','UNCOMMON','COMMON'];

/** レアリティ抽選(BASIC は対象外) */
function rollRarity(diffKey){
  const b = DIFFICULTY[diffKey].rareWeightBonus;
  return weightedPick([
    { v:'COMMON',   w: 65 - b },
    { v:'UNCOMMON', w: 25 },
    { v:'RARE',     w: 10 + b }
  ]);
}

/** 指定カテゴリ・レアリティから1枚選ぶ。候補が尽きたらレアリティを1段下げる */
function rollCardOf(cat, rarity, deckSoFar, excludeIds){
  const counts = {};
  for (const inst of deckSoFar) counts[inst.id] = (counts[inst.id] || 0) + 1;
  const exclude = excludeIds || [];

  let idx = RARITY_ORDER.indexOf(rarity);
  if (idx < 0) idx = RARITY_ORDER.indexOf('COMMON');

  for (let i = idx; i < RARITY_ORDER.length; i++){
    const r = RARITY_ORDER[i];
    const all = CARD_LIST.filter(c => c.cat === cat && c.rarity === r && isUnlocked(c.id)
                                      && exclude.indexOf(c.id) < 0);
    if (!all.length) continue;
    const fresh = all.filter(c => (counts[c.id] || 0) < 3);
    const pool = fresh.length ? fresh : all;   // 全部3枚に達していたら制限を解除
    return pick(pool).id;
  }
  return null;
}

/** 初期デッキ8枚 + 運動由来カード(最大16枚) */
function buildDeck(exercise, meta, diffKey){
  const deck = STARTING_DECK.map(id =>
    newCardInstance(id, meta.upgradedBasics.includes(id)));

  const counts = normalizeExercise(exercise);
  for (const ex of EXERCISES){
    const n = cardsFromCount(counts[ex.cat]);
    for (let i = 0; i < n; i++){
      const id = rollCardOf(ex.cat, rollRarity(diffKey), deck);
      if (id) deck.push(newCardInstance(id, false));
    }
  }
  return deck;
}

const REWARD_RARITY = {
  NORMAL: [{v:'COMMON',w:65},{v:'UNCOMMON',w:25},{v:'RARE',w:10}],
  HARD:   [{v:'COMMON',w:62},{v:'UNCOMMON',w:25},{v:'RARE',w:13}],
};
const REWARD_GOLD = { COMBAT:[10,20], ELITE:[25,40], BOSS:[50,75] };
const PRICE = { COMMON:[50,60], UNCOMMON:[75,95], RARE:[150,200], RELIC:[150,300] };
/** 入手経路ごとに優先度が2倍になるレリック */
const RELIC_FAVOR = {
  ELITE:'rel_training_proof', BOSS:'rel_battle_wisdom', TREASURE:'rel_unyielding_plate',
};

/** 出現しうるレリック(Phase 8 でメタ進行に接続する) */
function relicPool(){
  return RELIC_LIST.map(r => r.id);   // TODO(Phase 8): STARTER_RELICS + G.meta.unlockedRelics
}
function ownedRelics(){ return G.run ? G.run.relics : []; }
function availableRelics(){
  const owned = ownedRelics();
  return relicPool().filter(id => owned.indexOf(id) < 0);
}
/** 未所持レリックを1つ。全て所持済なら null */
function rollRelic(favorKey){
  const pool = availableRelics();
  if (!pool.length) return null;
  const favor = RELIC_FAVOR[favorKey];
  return weightedPick(pool.map(id => ({ v:id, w: id === favor ? 2 : 1 })));
}
function gainRelic(id){
  if (!id || G.run.relics.indexOf(id) >= 0) return false;
  G.run.relics.push(id);
  relicFlash[id] = Date.now();
  const r = RELICS[id];
  if (typeof toast === 'function' && r) toast('レリック獲得<br><b>' + r.icon + ' ' + r.name + '</b>');
  saveGame();
  return true;
}
function gainGold(n){ G.run.gold += n; saveGame(); }
function healPlayer(n){
  G.run.hp = clamp(G.run.hp + n, 0, G.run.maxHp);
  saveGame();
}
function addCardToDeck(id, upgraded){
  G.run.deck.push(newCardInstance(id, !!upgraded));
  saveGame();
}
function removeCardFromDeck(inst){
  const i = G.run.deck.findIndex(c => c.uid === inst.uid);
  if (i >= 0) G.run.deck.splice(i, 1);

/** カード報酬: 4カテゴリから重複なしで選び、各カテゴリ1枚ずつ(全カテゴリ均等) */
function pickRewardCards(diffKey, tier, count){
  const n = Math.min(count || 3, CATEGORIES.length);
  const cats = shuffle(CATEGORIES).slice(0, n);
  const out = [];
  for (const cat of cats){
    let rarity = weightedPick(REWARD_RARITY[diffKey] || REWARD_RARITY.NORMAL);
    // エリート/ボスの報酬は UNCOMMON 以上を保証する
    if (tier !== 'COMBAT' && rarity === 'COMMON') rarity = 'UNCOMMON';
    const id = rollCardOf(cat, rarity, [], out);
    if (id) out.push(id);
  }
  return out;
}

function makeReward(tier){
  const d = DIFFICULTY[G.run.difficulty];
  const gr = REWARD_GOLD[tier] || REWARD_GOLD.COMBAT;
  let gold = Math.floor(range(gr[0], gr[1]) * d.goldMult);
  gold = fireRelicHookGold(gold);
  return {
    tier: tier,
    gold: gold, goldTaken: false,
    cards: pickRewardCards(G.run.difficulty, tier, d.rewardChoices || 3),
    cardTaken: false,
    relic: tier === 'COMBAT' ? null : rollRelic(tier),
    relicTaken: false,
  };
}
/** 難易度倍率の適用後にレリック分を加算する */
function fireRelicHookGold(gold){
  return fireRelicHook('onBattleWin', { gold: gold }).gold;
}

/* --- ショップ --- */
function makeShopStock(){
  const d = DIFFICULTY[G.run.difficulty];
  const cards = [];
  const plan = ['COMMON','COMMON','COMMON','UNCOMMON','RARE'];
  const cats = shuffle(CATEGORIES);
  plan.forEach((rarity, i) => {
    const cat = cats[i % CATEGORIES.length];
    const id = rollCardOf(cat, rarity, [], cards.map(c => c.id));
    if (!id) return;
    const pr = PRICE[CARDS[id].rarity] || PRICE.COMMON;
    cards.push({ id: id, price: Math.floor(range(pr[0], pr[1]) * d.shopPriceMult), sold:false });
  });
  const relics = shuffle(availableRelics()).slice(0, range(2, 3)).map(id => ({
    id: id, price: Math.floor(range(PRICE.RELIC[0], PRICE.RELIC[1]) * d.shopPriceMult), sold:false,
  }));
  return { cards: cards, relics: relics, removeUsed:false };
}

/* --- 宝箱 --- */
function makeTreasure(){
  const d = DIFFICULTY[G.run.difficulty];
  return {
    relic: rollRelic('TREASURE'),
    gold: rnd(100) < 30 ? Math.floor(range(20, 40) * d.goldMult) : 0,
    opened: false,
  };
}

/* ===== SECTION: MAP ===== */
const MAP_ROWS = 7;
const MAP_COLS = 4;
const BOSS_ROW = MAP_ROWS - 1;
const NODE_ICON = {
  COMBAT:'⚔', ELITE:'👹', EVENT:'❓', REST:'🔥', SHOP:'🏪', TREASURE:'🎁', BOSS:'💀',
};
const NODE_LABEL = {
  COMBAT:'戦闘', ELITE:'エリート', EVENT:'イベント', REST:'休憩',
  SHOP:'ショップ', TREASURE:'宝箱', BOSS:'ボス',
};

function nodeKey(r, c){ return r + '_' + c; }

/** 7行×最大4列の分岐マップを生成する */
function generateMap(diffKey){
  for (let attempt = 0; attempt < 40; attempt++){
    const map = buildMapGraph();
    assignNodeTypes(map, diffKey);
    ensureConstraints(map);
    assignEnemyGroups(map);
    if (validateMap(map)) return map;
  }
  // ここに来ることは実質ないが、最後の1回は制約補正済みのものを返す
  const map = buildMapGraph();
  assignNodeTypes(map, diffKey);
  ensureConstraints(map);
  assignEnemyGroups(map);
  return map;
}

/** パスを6本引いてノードと辺を確定する */
function buildMapGraph(){
  const rows = [];
  for (let r = 0; r < MAP_ROWS; r++) rows.push(new Array(MAP_COLS).fill(null));

  const ensure = (r, c) => {
    if (!rows[r][c]) rows[r][c] = { row:r, col:c, type:null, next:[], prev:[], enemyGroup:null };
    return rows[r][c];
  };
  const link = (a, b) => {
    if (a.next.indexOf(b.col) < 0) a.next.push(b.col);
    if (b.prev.indexOf(a.col) < 0) b.prev.push(a.col);
  };

  // Row0 のスタート地点は2〜3箇所
  const startCols = shuffle([0,1,2,3]).slice(0, range(2,3)).sort((x,y) => x-y);
  for (const c of startCols) ensure(0, c);

  // Row0 → Row5 まで6本のパスを引く
  for (let i = 0; i < 6; i++){
    let c = startCols[i % startCols.length];
    for (let r = 0; r < BOSS_ROW - 1; r++){
      const from = ensure(r, c);
      const cands = [c - 1, c, c + 1].filter(x => x >= 0 && x < MAP_COLS);
      const nc = pick(cands);
      link(from, ensure(r + 1, nc));
      c = nc;
    }
  }

  // Row5 の全ノードを Row6 のボスへ収束させる
  const boss = ensure(BOSS_ROW, 0);
  boss.type = 'BOSS';
  for (let c = 0; c < MAP_COLS; c++){
    if (rows[BOSS_ROW - 1][c]) link(rows[BOSS_ROW - 1][c], boss);
  }
  return { rows: rows };
}

function mapNodes(map, fromRow, toRow){
  const out = [];
  for (let r = fromRow; r <= toRow; r++)
    for (let c = 0; c < MAP_COLS; c++) if (map.rows[r][c]) out.push(map.rows[r][c]);
  return out;
}
function parentsOf(map, node){
  if (node.row === 0) return [];
  return node.prev.map(c => map.rows[node.row - 1][c]).filter(Boolean);
}

function assignNodeTypes(map, diffKey){
  for (let c = 0; c < MAP_COLS; c++) if (map.rows[0][c]) map.rows[0][c].type = 'COMBAT';
  const weights = NODE_WEIGHTS[diffKey] || NODE_WEIGHTS.NORMAL;
  for (const n of mapNodes(map, 1, BOSS_ROW - 1)) n.type = weightedPick(weights);
}

/** 生成後の制約補正 */
function ensureConstraints(map){
  const last = BOSS_ROW - 1;   // = Row5

  // Row1 は ELITE / REST 禁止
  for (const n of mapNodes(map, 1, 1))
    if (n.type === 'ELITE' || n.type === 'REST') n.type = 'COMBAT';

  // ELITE はラン中1〜2個
  let elites = mapNodes(map, 2, last).filter(n => n.type === 'ELITE');
  if (elites.length === 0){
    const cands = mapNodes(map, 3, 4).filter(n => n.type === 'COMBAT');
    const pool = cands.length ? cands : mapNodes(map, 2, last);
    if (pool.length) pick(pool).type = 'ELITE';
  } else if (elites.length > 2){
    for (const n of shuffle(elites).slice(2)) n.type = 'COMBAT';
  }

  // SHOP はラン中1個以上
  if (!mapNodes(map, 1, last).some(n => n.type === 'SHOP')){
    const pool = mapNodes(map, 3, 3).filter(n => n.type !== 'ELITE');
    const alt  = mapNodes(map, 2, last).filter(n => n.type !== 'ELITE');
    const target = pool.length ? pool : alt;
    if (target.length) pick(target).type = 'SHOP';
  }

  // REST は連続禁止(親が REST なら EVENT に置換)
  for (let r = 2; r <= last; r++)
    for (const n of mapNodes(map, r, r))
      if (n.type === 'REST' && parentsOf(map, n).some(p => p.type === 'REST')) n.type = 'EVENT';

  // EVENT は連続2回まで(3連続になる経路の3つ目を COMBAT に)
  for (let r = 3; r <= last; r++){
    for (const n of mapNodes(map, r, r)){
      if (n.type !== 'EVENT') continue;
      const three = parentsOf(map, n).some(p =>
        p.type === 'EVENT' && parentsOf(map, p).some(g => g.type === 'EVENT'));
      if (three) n.type = 'COMBAT';
    }
  }

  // ボス直前(Row5)に REST を最低1つ保証
  if (!mapNodes(map, last, last).some(n => n.type === 'REST')){
    const all = mapNodes(map, last, last);
    // できるだけ親が REST でないノードを選ぶ(連続禁止を壊さないため)
    const safe = all.filter(n => !parentsOf(map, n).some(p => p.type === 'REST'));
    const target = safe.length ? safe : all;
    if (target.length) pick(target).type = 'REST';
  }
}

/** 戦闘ノードの敵編成を生成時に確定させる(リロードで変わらないように) */
function assignEnemyGroups(map){
  let lastKey = null;
  const assign = (n, poolKey) => {
    const g = pickEncounter(poolKey, lastKey);
    lastKey = g.join(',');
    n.enemyGroup = g;
  };
  for (let r = 0; r <= BOSS_ROW; r++){
    for (const n of mapNodes(map, r, r)){
      if (n.type === 'COMBAT'){
        assign(n, r <= 2 ? 'COMBAT_EARLY' : (r <= 4 ? 'COMBAT_MID' : 'COMBAT_LATE'));
      } else if (n.type === 'ELITE'){
        assign(n, 'ELITE');
      } else if (n.type === 'BOSS'){
        assign(n, 'BOSS');
      }
    }
  }
}

/** 制約を満たしているか(テストとリトライ判定に使う) */
function validateMap(map){
  const last = BOSS_ROW - 1;
  const errs = mapProblems(map);
  return errs.length === 0;
}

function mapProblems(map){
  const last = BOSS_ROW - 1;
  const errs = [];
  // Row0 → Row6 の経路が存在するか
  let reach = new Set();
  for (let c = 0; c < MAP_COLS; c++) if (map.rows[0][c]) reach.add(c);
  if (!reach.size) errs.push('Row0にノードがない');
  for (let r = 0; r < BOSS_ROW; r++){
    const nx = new Set();
    for (const c of reach) if (map.rows[r][c]) for (const n of map.rows[r][c].next) nx.add(n);
    reach = nx;
    if (!reach.size){ errs.push('Row' + (r + 1) + 'へ到達できない'); break; }
  }
  // 孤立ノード
  for (const n of mapNodes(map, 1, BOSS_ROW))
    if (!n.prev.length) errs.push('孤立ノード ' + nodeKey(n.row, n.col));
  for (const n of mapNodes(map, 0, BOSS_ROW - 1))
    if (!n.next.length) errs.push('行き止まり ' + nodeKey(n.row, n.col));

  const nodes = mapNodes(map, 1, last);
  const cnt = t => nodes.filter(n => n.type === t).length;
  if (cnt('ELITE') < 1 || cnt('ELITE') > 2) errs.push('ELITE数 ' + cnt('ELITE'));
  if (cnt('SHOP') < 1) errs.push('SHOPがない');
  if (!mapNodes(map, last, last).some(n => n.type === 'REST')) errs.push('Row5にRESTがない');
  for (const n of mapNodes(map, 1, 1))
    if (n.type === 'ELITE' || n.type === 'REST') errs.push('Row1に' + n.type);
  for (const n of nodes)
    if (n.type === 'REST' && parentsOf(map, n).some(p => p.type === 'REST')) errs.push('RESTが連続');
  for (const n of nodes){
    if (n.type !== 'EVENT') continue;
    if (parentsOf(map, n).some(p => p.type === 'EVENT'
        && parentsOf(map, p).some(g => g.type === 'EVENT'))) errs.push('EVENTが3連続');
  }
  for (const n of mapNodes(map, 0, BOSS_ROW))
    if ((n.type === 'COMBAT' || n.type === 'ELITE' || n.type === 'BOSS') && !n.enemyGroup)
      errs.push('敵編成なし ' + nodeKey(n.row, n.col));
  return errs;
}

/* --- 進行 --- */

/** 現在地から選べるノードの一覧 */
function selectableNodes(){
  const run = G.run;
  if (!run || !run.map) return [];
  if (run.currentRow < 0) return mapNodes(run.map, 0, 0);
  if (run.currentRow >= BOSS_ROW) return [];
  const cur = run.map.rows[run.currentRow][run.currentCol];
  if (!cur) return [];
  return cur.next.map(c => run.map.rows[run.currentRow + 1][c]).filter(Boolean);
}

function enterNode(node){
  const run = G.run;
  run.currentRow = node.row;
  run.currentCol = node.col;
  if (run.visited.indexOf(nodeKey(node.row, node.col)) < 0)
    run.visited.push(nodeKey(node.row, node.col));
  saveGame();
  if (node.type === 'COMBAT' || node.type === 'ELITE' || node.type === 'BOSS'){
    startBattle(node.enemyGroup);
  } else {
    go(node.type);
  }
}

function currentNode(){
  const run = G.run;
  if (!run || !run.map || run.currentRow < 0) return null;
  return run.map.rows[run.currentRow][run.currentCol] || null;
}

/* ===== SECTION: BATTLE ===== */
const MAX_HAND = 10;
const STATUS_ICON = { weak:'🌀', vulnerable:'💥', bleed:'🩸', strength:'💪' };
const STATUS_NAME = { weak:'弱体', vulnerable:'脆弱', bleed:'出血', strength:'力' };
const INTENT_ICON = { attack:'⚔', block:'🛡', buff:'⬆', debuff:'⬇', heal:'✚' };

let B = null;   // G.battle のショートカット

function newStatus(){ return { weak:0, vulnerable:0, bleed:0, strength:0 }; }

function makeEnemy(id, idx){
  const def = ENEMIES[id];
  if (!def) throw new Error('未知の敵ID: ' + id);
  const d = DIFFICULTY[G.run.difficulty];
  const hp = Math.round(range(def.hpMin, def.hpMax) * d.enemyHpMult);
  return {
    uid: 'e' + idx, id: id, name: def.name, tier: def.tier,
    hp: hp, maxHp: hp, block: 0,
    status: Object.assign(newStatus(), { strength: d.enemyStartStrength[def.tier] || 0 }),
    phaseIdx: 0, patternIdx: def.startPatternIdx || 0,
    intent: null, turnCount: 0, alive: true
  };
}

const DEATH_ANIM_MS = 340;
let _renderTimer = null;
/** 死亡アニメの終了後などに、まとめて再描画する */
function scheduleRender(delay){
  if (_renderTimer) clearTimeout(_renderTimer);
  _renderTimer = setTimeout(() => { _renderTimer = null; if (G.battle) render(); }, delay);
}

function log(msg){
  if (!msg) return;
  B.log.push(msg);
  if (B.log.length > 60) B.log.shift();
}

function startBattle(enemyIds){
  B = G.battle = {
    enemyIds: enemyIds.slice(),
    enemies: enemyIds.map((id, i) => makeEnemy(id, i)),
    drawPile: [], hand: [], discardPile: [], exhaustPile: [], powers: [],
    energy: 3, maxEnergy: 3,
    block: 0, status: newStatus(),
    evade: 0, counter: 0, keepBlock: false, reflectPending: 0,
    blockPerTurn: [],
    attacksPlayedThisTurn: 0,
    turn: 0, phase: 'PLAYER',
    selecting: null,
    log: []
  };
  B.drawPile = shuffle(G.run.deck.map(c => ({ uid:c.uid, id:c.id, upgraded:c.upgraded })));
  if (G.run.tempEnergy){
    B.maxEnergy += G.run.tempEnergy;
    log('[オーバーワーク] このバトルは Energy+' + G.run.tempEnergy);
    G.run.tempEnergy = 0;
  }
  log('戦闘開始: ' + B.enemies.map(e => e.name).join(' / '));
  startPlayerTurn();
  // ターン開始処理(ブロックのリセット)の後に発動させる。
  // 先に呼ぶと「戦闘開始時ブロック+5」がリセットで消えてしまう
  fireRelicHook('onBattleStart', { battle: B });
  go('BATTLE');
}

function startPlayerTurn(){
  B.turn++;
  B.phase = 'PLAYER';
  B.selecting = null;
  B.energy = B.maxEnergy;
  if (!B.keepBlock) B.block = 0;
  // 回避 / 反撃は直前の敵ターンを守るためのもの。持ち越さない
  B.evade = 0;
  B.counter = 0;

  // ターン開始時のブロック(踏ん張り / 継続する強さ)
  for (let i = B.blockPerTurn.length - 1; i >= 0; i--){
    const bp = B.blockPerTurn[i];
    gainBlock(bp.value);
    log('ターン開始: ブロック+' + bp.value);
    if (bp.turnsLeft !== Infinity){
      bp.turnsLeft--;
      if (bp.turnsLeft <= 0) B.blockPerTurn.splice(i, 1);
    }
  }

  if (B.status.weak > 0) B.status.weak--;
  if (B.status.vulnerable > 0) B.status.vulnerable--;
  B.attacksPlayedThisTurn = 0;

  drawCard(Math.max(0, 5 - B.hand.length));
  // 敵の意図を決める。ターン経過で強化される敵(怠惰の巨像)はここで先に加算し、
  // 表示される Intent と実際の被ダメージが必ず一致するようにする
  for (const e of B.enemies){
    if (!e.alive) continue;
    const def = ENEMIES[e.id];
    if (def.onTurnStart) log(def.onTurnStart(e));
    syncPhase(e);
    e.intent = decideIntent(e);
  }
  fireRelicHook('onTurnStart', { battle: B, turn: B.turn });
}

function drawCard(n){
  for (let i = 0; i < n; i++){
    if (B.hand.length >= MAX_HAND){ log('手札が上限(' + MAX_HAND + '枚)のため引けない'); return; }
    if (!B.drawPile.length){
      if (!B.discardPile.length) { log('山札が尽きた'); return; }
      B.drawPile = shuffle(B.discardPile);
      B.discardPile = [];
      log('捨て札をシャッフルして山札に戻した');
    }
    B.hand.push(B.drawPile.pop());
  }
}

/* --- ダメージ計算 --- */
function calcDamage(base, attacker, defender, opts){
  opts = opts || {};
  const useStr  = opts.strength   !== false;
  const useWeak = opts.weak       !== false;
  const useVuln = opts.vulnerable !== false;
  let v = base + (useStr ? (attacker.status.strength || 0) : 0);
  if (v < 0) v = 0;
  if (useVuln && defender.status.vulnerable > 0) v *= 1.5;
  if (useWeak && attacker.status.weak > 0) v *= 0.75;
  return Math.floor(v);
}

function playerActor(){ return { isPlayer:true, status: B.status }; }

function gainBlock(v){
  let amount = v;
  for (const p of B.powers){
    for (const e of effectiveCard(p).effects) if (e.type === 'blockBonus') amount += e.value;
  }
  if (amount < 0) amount = 0;
  amount = Math.max(0, fireRelicHook('onGainBlock', { amount: amount }).amount);
  B.block += amount;
  return amount;
}

function dealDamageToEnemy(enemy, amount, opts){
  if (!enemy.alive || amount <= 0) return 0;
  opts = opts || {};
  let dealt = amount;
  if (!opts.ignoreBlock){
    const absorbed = Math.min(enemy.block, dealt);
    enemy.block -= absorbed;
    dealt -= absorbed;
  }
  enemy.hp -= dealt;
  if (enemy.hp <= 0){
    enemy.hp = 0;
    enemy.alive = false;
    enemy.diedAt = Date.now();
    G.run.kills = (G.run.kills || 0) + 1;
    log(enemy.name + 'を倒した!');
    onEnemyDeath(enemy);
    scheduleRender(DEATH_ANIM_MS + 60);
  } else {
    syncPhase(enemy);
  }
  return dealt;
}

function onEnemyDeath(dead){
  for (const e of B.enemies){
    if (e === dead || !e.alive) continue;
    const def = ENEMIES[e.id];
    if (def.onAllyDeath) log(def.onAllyDeath(e));
  }
}

/** 敵からプレイヤーへの攻撃1ヒット分 */
function dealDamageToPlayer(amount, source){
  if (B.evade > 0){
    B.evade--;
    log('回避! 攻撃を無効化した(残り' + B.evade + ')');
    triggerCounter(source);
    return 0;
  }
  const absorbed = Math.min(B.block, amount);
  B.block -= absorbed;
  const through = amount - absorbed;
  G.run.hp -= through;
  if (G.run.hp < 0) G.run.hp = 0;
  log('プレイヤーに' + amount + 'ダメージ'
      + (absorbed ? '(ブロックで' + absorbed + '軽減)' : '')
      + ' → HP ' + G.run.hp);
  triggerCounter(source);
  return through;
}

function triggerCounter(source){
  if (B.counter <= 0 || !source || !source.alive) return;
  const dmg = B.counter;
  B.counter = 0;
  log('カウンター! ' + source.name + 'に' + dmg + 'ダメージ');
  dealDamageToEnemy(source, dmg);
}

/* --- カード使用 --- */
function cardCost(card){
  const ctx = fireRelicHook('onCardCost', { card: card, cost: card.cost });
  return Math.max(0, ctx.cost);
}

function livingEnemies(){ return B.enemies.filter(e => e.alive); }

function canPlay(inst){
  if (B.phase !== 'PLAYER') return false;
  return cardCost(effectiveCard(inst)) <= B.energy;
}

/** handIndex のカードを使う。targetIdx は B.enemies のインデックス */
function playCard(handIndex, targetIdx){
  if (B.phase !== 'PLAYER') return;
  const inst = B.hand[handIndex];
  if (!inst) return;
  const card = effectiveCard(inst);
  const cost = cardCost(card);
  if (cost > B.energy){ log('Energyが足りない'); return; }

  const alive = livingEnemies();
  if (!alive.length) return;
  let target = null;
  if (card.target === 'single'){
    target = B.enemies[targetIdx];
    if (!target || !target.alive) target = alive[0];
  }

  B.energy -= cost;
  B.hand.splice(handIndex, 1);
  B.selecting = null;
  log('▶ ' + card.name + (card.target === 'single' && alive.length > 1 ? ' → ' + target.name : ''));

  const ctx = { card: card, inst: inst, target: target };
  for (const e of card.effects) resolveEffect(e, ctx);

  if (card.type === 'attack') B.attacksPlayedThisTurn++;
  if (card.type === 'power' ) firePowerUsed(card);

  if (card.keep)          B.powers.push(inst);
  else if (card.exhaust)  B.exhaustPile.push(inst);
  else                    B.discardPile.push(inst);

  checkBattleEnd();
  if (B.phase === 'PLAYER') render();
}

/** 忍耐【Power】: POWERカードを使うたびブロック */
function firePowerUsed(justPlayed){
  for (const p of B.powers){
    for (const e of effectiveCard(p).effects){
      if (e.type === 'blockOnPower'){
        const got = gainBlock(e.value);
        log('[忍耐] ブロック+' + got);
      }
    }
  }
}

/* --- 効果解決 --- */
function resolveEffect(e, ctx){
  const card = ctx.card;
  const me = playerActor();
  const targets = card.target === 'all' ? livingEnemies()
                : ctx.target ? [ctx.target] : [];

  switch (e.type){
    case 'damage': {
      for (const t of targets){
        const dmg = calcDamage(e.value, me, t, { strength: card.type === 'attack' });
        dealDamageToEnemy(t, dmg);
        log(t.name + 'に' + dmg + 'ダメージ (残HP ' + t.hp + ')');
      }
      break;
    }
    case 'damageMulti': {
      for (let i = 0; i < e.times; i++){
        for (const t of targets){
          if (!t.alive) continue;
          const dmg = calcDamage(e.value, me, t, { strength: card.type === 'attack' });
          dealDamageToEnemy(t, dmg);
          log(t.name + 'に' + dmg + 'ダメージ (' + (i + 1) + '/' + e.times + ', 残HP ' + t.hp + ')');
        }
      }
      break;
    }
    case 'block': {
      const got = gainBlock(e.value);
      log('ブロック+' + got + ' (合計' + B.block + ')');
      break;
    }
    case 'draw':
      drawCard(e.value);
      log('カードを' + e.value + '枚引いた');
      break;
    case 'status': {
      for (const t of targets){
        t.status[e.key] = (t.status[e.key] || 0) + e.value;
        log(t.name + 'に' + STATUS_NAME[e.key] + e.value + 'を付与');
      }
      break;
    }
    case 'evade':
      B.evade += e.value;
      log('回避態勢(' + B.evade + '回)');
      break;
    case 'blockPerTurn':
      B.blockPerTurn.push({ value: e.value, turnsLeft: e.turns === 0 ? Infinity : e.turns });
      log(e.turns === 0 ? '毎ターン開始時にブロック' + e.value
                        : e.turns + 'ターンの間ターン開始時にブロック' + e.value);
      break;
    case 'energy':
      B.energy += e.value;
      log('Energy+' + e.value + ' (残り' + B.energy + ')');
      break;
    case 'strength':
      B.status.strength += e.value;
      log('力+' + e.value + ' (合計' + B.status.strength + ')');
      break;
    case 'counter':
      B.counter = e.value;
      log('カウンター体勢(' + e.value + 'ダメージ反撃)');
      break;
    case 'reflect':
      B.reflectPending = 1;
      log('反発: ターン終了時に残ブロック分を反射する');
      break;
    case 'keepBlock':
      B.keepBlock = true;
      log('以降、ブロックはターン終了時に消滅しない');
      break;
    case 'damagePerAttackPlayed': {
      const base = e.base + B.attacksPlayedThisTurn * e.per;
      for (const t of targets){
        const dmg = calcDamage(base, me, t, { strength: card.type === 'attack' });
        dealDamageToEnemy(t, dmg);
        log(t.name + 'に' + dmg + 'ダメージ'
            + ' (使用済ATTACK ' + B.attacksPlayedThisTurn + '枚, 残HP ' + t.hp + ')');
      }
      break;
    }
    case 'damagePerAttackInHand': {
      const n = B.hand.filter(h => CARDS[h.id].cat === 'ATTACK').length;
      const base = e.base + n * e.per;
      for (const t of targets){
        const dmg = calcDamage(base, me, t, { strength: card.type === 'attack' });
        dealDamageToEnemy(t, dmg);
        log(t.name + 'に' + dmg + 'ダメージ (手札のATTACK ' + n + '枚, 残HP ' + t.hp + ')');
      }
      break;
    }
    // 場に残って初めて効く継続効果。使用時点では何もしない
    case 'blockOnPower':
    case 'blockBonus':
      break;
    default:
      console.warn('未知のeffect: ' + e.type);
  }
}

/* --- カードテキストの動的生成 --- */

/** blockBonus(完全防御)込みの実効ブロック値 */
function previewBlock(v){
  if (!B) return v;
  let amount = v;
  for (const p of B.powers)
    for (const e of effectiveCard(p).effects) if (e.type === 'blockBonus') amount += e.value;
  return Math.max(0, amount);
}

/** 現在の場の状態で、そのカードが実際に与えるダメージ */
function previewDamage(base, card, target){
  if (!B) return base;
  return calcDamage(base, playerActor(), target || { status: newStatus() },
                    { strength: card.type === 'attack' });
}

function effectText(e, card, target, excludeUid){
  const all = card.target === 'all' ? '敵全体に' : '';
  switch (e.type){
    case 'damage':
      return previewDamage(e.value, card, target) + 'ダメージ';
    case 'damageMulti':
      return previewDamage(e.value, card, target) + 'ダメージ×' + e.times + '回';
    case 'damagePerAttackPlayed': {
      const n = B ? B.attacksPlayedThisTurn : 0;
      return previewDamage(e.base + n * e.per, card, target) + 'ダメージ'
           + '(基本' + e.base + '+使用済ATTACK×' + e.per + ')';
    }
    case 'damagePerAttackInHand': {
      const n = B ? B.hand.filter(h => CARDS[h.id].cat === 'ATTACK'
                                       && h.uid !== excludeUid).length : 0;
      return previewDamage(e.base + n * e.per, card, target) + 'ダメージ'
           + '(基本' + e.base + '+手札ATTACK×' + e.per + ')';
    }
    case 'block':       return 'ブロック' + previewBlock(e.value);
    case 'draw':        return 'カードを' + e.value + '枚引く';
    case 'energy':      return 'Energy+' + e.value;
    case 'status':      return all + STATUS_NAME[e.key] + e.value + 'を付与';
    case 'strength':    return '力+' + e.value;
    case 'evade':       return '受ける攻撃' + e.value + '回を無効化';
    case 'counter':     return 'このターン攻撃を受けたら' + e.value + 'ダメージ反撃(1回)';
    case 'blockPerTurn':return (e.turns === 0 ? '毎ターン開始時' : e.turns + 'ターンの間ターン開始時')
                             + 'にブロック' + previewBlock(e.value);
    case 'reflect':     return 'ターン終了時、残ブロック分を敵全体に反射';
    case 'blockOnPower':return 'POWERカードを使うたびブロック' + e.value;
    case 'blockBonus':  return 'ブロックを得るたび追加で+' + e.value;
    case 'keepBlock':   return 'この戦闘中ブロックがターン終了時に消えない';
    default:            return e.type;
  }
}

/* --- ターン終了 / 敵ターン --- */
function endPlayerTurn(){
  if (B.phase !== 'PLAYER') return;
  B.phase = 'ENEMY';
  B.selecting = null;

  // 反発: 残ブロック分を敵全体に反射
  if (B.reflectPending > 0 && B.block > 0){
    const me = playerActor();
    for (const t of livingEnemies()){
      const dmg = calcDamage(B.block, me, t, { strength:false, weak:false });
      dealDamageToEnemy(t, dmg);
      log('[反発] ' + t.name + 'に' + dmg + 'ダメージ');
    }
  }
  B.reflectPending = 0;

  while (B.hand.length) B.discardPile.push(B.hand.pop());

  if (checkBattleEnd()) return;
  render();
  setTimeout(runEnemyTurn, 350);
}

function runEnemyTurn(){
  if (!B || B.phase !== 'ENEMY') return;
  const queue = livingEnemies().slice();
  const step = () => {
    if (!B || B.phase !== 'ENEMY') return;
    const e = queue.shift();
    if (!e){ finishEnemyTurn(); return; }
    if (e.alive) actEnemy(e);
    render();
    if (checkBattleEnd()) return;
    setTimeout(step, 320);
  };
  step();
}

function actEnemy(e){
  e.block = 0;                                  // 敵のブロックは自ターン開始時に消える
  syncPhase(e);
  const act = e.intent || decideIntent(e);
  const d = DIFFICULTY[G.run.difficulty];

  if (act.intent === 'attack'){
    const times = act.times || 1;
    const base = Math.floor(act.value * d.enemyDmgMult);
    for (let i = 0; i < times; i++){
      const dmg = calcDamage(base, e, playerActor(), {});
      log(e.name + 'の攻撃' + (times > 1 ? '(' + (i + 1) + '/' + times + ')' : ''));
      dealDamageToPlayer(dmg, e);
      if (G.run.hp <= 0) break;
    }
  } else if (act.intent === 'block'){
    e.block += act.value;
    log(e.name + 'はブロック' + act.value + 'を得た');
  } else if (act.intent === 'buff'){
    e.status.strength += act.value;
    log(e.name + 'の力+' + act.value);
  } else if (act.intent === 'heal'){
    e.hp = Math.min(e.maxHp, e.hp + act.value);
    log(e.name + 'はHPを' + act.value + '回復した (' + e.hp + ')');
  }
  // 複合キー
  if (act.strength){ e.status.strength += act.strength; log(e.name + 'の力+' + act.strength); }
  if (act.heal && act.intent !== 'heal'){
    e.hp = Math.min(e.maxHp, e.hp + act.heal);
    log(e.name + 'はHPを' + act.heal + '回復した (' + e.hp + ')');
  }
  if (act.status){
    for (const k in act.status){
      B.status[k] = (B.status[k] || 0) + act.status[k];
      log('プレイヤーに' + STATUS_NAME[k] + act.status[k] + 'を付与');
    }
  }

  if (e.status.weak > 0) e.status.weak--;
  if (e.status.vulnerable > 0) e.status.vulnerable--;
  e.turnCount++;
  advancePattern(e);
}

function finishEnemyTurn(){
  // ターン終了時: 出血
  for (const e of livingEnemies()){
    if (e.status.bleed > 0){
      const amount = fireRelicHook('onBleedDamage', { amount: e.status.bleed, enemy: e }).amount;
      dealDamageToEnemy(e, amount, { ignoreBlock:true });
      log('[出血] ' + e.name + 'に' + amount + 'ダメージ (残HP ' + e.hp + ')');
    }
  }
  if (checkBattleEnd()) return;
  startPlayerTurn();
  render();
}

/* --- 敵AI --- */

/** hpThreshold は数値、または難易度パラメータ名('bossPhase2') */
function phaseThreshold(ph){
  if (typeof ph.hpThreshold === 'number') return ph.hpThreshold;
  return DIFFICULTY[G.run.difficulty][ph.hpThreshold];
}

/** HP割合から現在のフェーズ番号を求める(phases は閾値の降順) */
function phaseIndexFor(e){
  const def = ENEMIES[e.id];
  const ratio = e.maxHp > 0 ? e.hp / e.maxHp : 0;
  let idx = 0;
  for (let i = 0; i < def.phases.length; i++){
    if (ratio <= phaseThreshold(def.phases[i])) idx = i;
  }
  return idx;
}

/** フェーズ切替を検出して onEnter を発火する */
function syncPhase(e){
  if (!e.alive) return false;
  const next = phaseIndexFor(e);
  // フェーズは一方向。自己回復でHPが戻っても前の(弱い)フェーズには戻さない
  if (next <= e.phaseIdx) return false;
  e.phaseIdx = next;
  e.patternIdx = 0;
  const ph = ENEMIES[e.id].phases[next];
  if (ph.onEnter) log(ph.onEnter(e));
  e.intent = decideIntent(e);
  return true;
}

function currentPhase(e){
  const def = ENEMIES[e.id];
  return def.phases[e.phaseIdx] || def.phases[0];
}

function decideIntent(e){
  const ph = currentPhase(e);
  if (ph.weighted) return weightedPick(ph.pattern);
  return ph.pattern[e.patternIdx % ph.pattern.length];
}

function advancePattern(e){
  if (!currentPhase(e).weighted) e.patternIdx++;
  if (e.alive) e.intent = decideIntent(e);
}

/* --- 勝敗判定 --- */
function checkBattleEnd(){
  if (G.run.hp <= 0){
    B.phase = 'LOSE';
    log('敗北…');
    setTimeout(() => { go('GAMEOVER'); }, 400);
    return true;
  }
  if (!livingEnemies().length){
    B.phase = 'WIN';
    log('戦闘に勝利した!');
    const node = currentNode();
    const boss = node && node.type === 'BOSS';
    if (boss) G.meta[G.run.difficulty === 'HARD' ? 'clearedHard' : 'clearedNormal'] = true;
    setTimeout(() => { go(boss ? 'VICTORY' : 'REWARD'); }, 400);
    return true;
  }
  return false;
}

/* ===== SECTION: SCREENS ===== */
const SCREENS = ['TITLE','DIFFICULTY','EXERCISE','DECK_PREVIEW','MAP','BATTLE','REWARD',
                 'SHOP','REST','EVENT','TREASURE','META','GAMEOVER','VICTORY'];

function go(screen){
  if (!SCREENS.includes(screen)) throw new Error('未知の画面: ' + screen);
  G.screen = screen;
  render();
}

function render(){
  B = G.battle;
  const app = document.getElementById('app');
  app.innerHTML = '';
  const fn = RENDERERS[G.screen] || renderPlaceholder;
  const nodes = fn();
  for (const n of (Array.isArray(nodes) ? nodes : [nodes])) if (n) app.appendChild(n);
  if (DEBUG) app.appendChild(renderDebugPanel());
}

/* --- 共通パーツ --- */

/** ラン中の画面で使い回すヘッダ */
function renderHud(){
  const r = G.run;
  if (!r) return null;
  const hud = el('div', 'mr-hud');
  hud.appendChild(el('span', 'chip', '❤ <span class="hpv">' + r.hp + '</span>/' + r.maxHp));
  hud.appendChild(el('span', 'chip', '💰 <span class="goldv">' + r.gold + '</span>'));
  const relics = el('span', 'chip mr-relics');
  if (!r.relics.length) relics.textContent = '—';
  const now = Date.now();
  let flashing = false;
  for (const id of r.relics){
    const rel = RELICS[id];
    if (!rel) continue;
    const fresh = relicFlash[id] && (now - relicFlash[id] < 600);
    if (fresh) flashing = true;
    const icon = el('span', 'relic' + (fresh ? ' flash' : ''), rel.icon);
    icon.title = rel.name + ' — ' + rel.desc;
    relics.appendChild(icon);
  }
  relics.addEventListener('click', showRelicList);
  hud.appendChild(relics);
  if (flashing) scheduleRender(650);
  hud.appendChild(el('span', 'mr-spacer'));
  const d = DIFFICULTY[r.difficulty];
  hud.appendChild(el('span', 'mr-badge' + (r.difficulty === 'HARD' ? ' hard' : ''), d.label));
  return hud;
}

/** カード1枚の DOM。opts: {playable, disabled, onClick, showCost} */
function renderCardEl(inst, opts){
  opts = opts || {};
  const c = effectiveCard(inst);
  const cls = ['mr-card', 'cat-' + c.cat, 'rar-' + c.rarity];
  if (inst.upgraded) cls.push('upgraded');
  if (opts.playable) cls.push('playable');
  if (opts.disabled) cls.push('disabled');
  const node = el('div', cls.join(' '));
  if (opts.showCost !== false){
    node.appendChild(el('div', 'ccost', String(opts.cost != null ? opts.cost : c.cost)));
  }
  node.appendChild(el('div', 'cname', c.name));
  node.appendChild(el('div', 'ctext', opts.text != null ? opts.text : cardDisplayText(inst)));
  node.appendChild(el('div', 'ctag', CAT_LABEL[c.cat] + ' / ' + RARITY_LABEL[c.rarity]));
  if (opts.onClick && !opts.disabled) node.addEventListener('click', () => opts.onClick(inst));
  return node;
}

/** カードのグリッド表示 */
function renderDeckList(cards, opts){
  const grid = el('div', 'mr-grid');
  for (const inst of cards) grid.appendChild(renderCardEl(inst, opts));
  return grid;
}

function renderCores(cores){
  const wrap = el('div', 'mr-cores');
  for (const ex of EXERCISES){
    const c = el('div', 'mr-core ' + ex.core);
    c.appendChild(el('div', 'n', String(cores[ex.core] || 0)));
    c.appendChild(el('div', 'l', ex.coreLabel));
    wrap.appendChild(c);
  }
  return wrap;
}

/* --- 運動記録の入力 --- */
function renderExercise(){
  if (!G.draft) { G.draft = newDraft('NORMAL'); }
  const draft = G.draft;
  const d = DIFFICULTY[draft.difficulty];

  const s = el('div', 'mr-screen');
  const head = el('div');
  head.appendChild(el('h2', 'mr-title', '今日の運動記録'));
  head.appendChild(el('p', 'mr-sub',
    '回数がそのままデッキになる。難易度: <b>' + d.label + '</b>'));
  s.appendChild(head);

  const scroll = el('div', 'mr-scroll');
  const updaters = [];

  for (const ex of EXERCISES){
    const box = el('div', 'mr-ex cat-' + ex.cat);
    const h = el('div', 'exhead');
    h.appendChild(el('span', 'exname', ex.label));
    h.appendChild(el('span', 'excat', CAT_NAME[ex.cat] + '(' + CAT_LABEL[ex.cat] + ')'));
    box.appendChild(h);

    const row = el('div', 'exinput');
    const input = el('input');
    input.type = 'number'; input.min = '0'; input.step = '1';
    input.value = String(draft.exercise[ex.key] || 0);
    input.setAttribute('aria-label', ex.label);

    const out = el('div', 'exout');
    const update = () => {
      let v = Math.max(0, Math.floor(Number(input.value) || 0));
      input.value = String(v);
      draft.exercise[ex.key] = v;
      const count = toCount(ex.key, v);
      const cards = cardsFromCount(count);
      const cores = coresGained(count, draft.difficulty);
      const parts = [];
      if (ex.key === 'plankSeconds'){
        parts.push('<span>' + v + '秒 → <b>' + count + 'カウント</b>相当</span>');
      }
      parts.push('<span>生成カード <b class="' + (cards ? '' : 'zero') + '">' + cards + '枚</b>'
                 + (cards === 4 ? '(上限)' : '') + '</span>');
      parts.push('<span>' + ex.coreLabel + ' <b class="' + (cores ? '' : 'zero') + '">+' + cores + '</b></span>');
      out.innerHTML = parts.join('');
    };
    updaters.push(update);

    // btn() は mr-btn クラスを付けてしまうので、ステッパーは個別に組む
    const mkStep = (delta) => {
      const b = el('button', 'mr-step', (delta > 0 ? '+' : '') + delta);
      b.addEventListener('click', () => {
        input.value = String(Math.max(0, (Number(input.value) || 0) + delta));
        update(); updateTotal();
      });
      return b;
    };
    row.appendChild(mkStep(-10));
    row.appendChild(mkStep(-1));
    row.appendChild(input);
    row.appendChild(mkStep(1));
    row.appendChild(mkStep(10));
    input.addEventListener('input', () => { update(); updateTotal(); });
    input.addEventListener('blur', () => { update(); updateTotal(); });

    box.appendChild(row);
    box.appendChild(out);
    scroll.appendChild(box);
  }

  const total = el('div', 'mr-panel');
  const updateTotal = () => {
    const counts = normalizeExercise(draft.exercise);
    let n = 0;
    for (const ex of EXERCISES) n += cardsFromCount(counts[ex.cat]);
    total.innerHTML =
      '<div class="mr-note">デッキ枚数</div>'
      + '<div style="font-size:20px;font-weight:700">' + (STARTING_DECK.length + n) + '枚'
      + ' <span class="mr-note" style="font-size:12px">(基本' + STARTING_DECK.length + ' + 生成' + n + ')</span></div>';
  };
  for (const u of updaters) u();
  updateTotal();
  scroll.appendChild(total);
  scroll.appendChild(el('div', 'mr-note',
    '※ プランクは' + PLANK_SECONDS_PER_COUNT + '秒=1カウント換算。'
    + '生成枚数は floor(√(回数÷5)) で、1種目あたり最大4枚。'));
  s.appendChild(scroll);

  const foot = el('div', 'mr-sticky');
  foot.appendChild(btn('この記録でデッキを組む', 'primary', () => {
    draft.deck = buildDeck(draft.exercise, G.meta, draft.difficulty);
    go('DECK_PREVIEW');
  }));
  foot.appendChild(btn('難易度を選び直す', 'ghost', () => { G.draft = null; go('DIFFICULTY'); }));
  s.appendChild(foot);
  return s;
}

/* --- デッキ確認 --- */
function renderDeckPreview(){
  const draft = G.draft;
  if (!draft || !draft.deck){ go('EXERCISE'); return el('div'); }
  const counts = normalizeExercise(draft.exercise);
  const startIds = STARTING_DECK.slice();

  // 初期デッキ分を取り除いた残り = 生成カード
  const generated = [];
  const pool = startIds.slice();
  for (const inst of draft.deck){
    const i = pool.indexOf(inst.id);
    if (i >= 0) pool.splice(i, 1); else generated.push(inst);
  }

  const s = el('div', 'mr-screen');
  const head = el('div');
  head.appendChild(el('h2', 'mr-title', 'デッキ確認'));
  head.appendChild(el('p', 'mr-sub',
    '全' + draft.deck.length + '枚(基本' + startIds.length + ' + 生成' + generated.length + ')'
    + ' / ' + DIFFICULTY[draft.difficulty].label));
  s.appendChild(head);

  const scroll = el('div', 'mr-scroll');

  // 換算表
  const tp = el('div', 'mr-panel');
  const t = el('table', 'mr-table');
  t.innerHTML = '<thead><tr><th>種目</th><th>入力</th><th>換算</th><th>カード</th><th>コア</th></tr></thead>';
  const tb = el('tbody');
  for (const ex of EXERCISES){
    const raw = draft.exercise[ex.key] || 0;
    const c = counts[ex.cat];
    const tr = el('tr');
    tr.innerHTML = '<td>' + ex.label + '</td>'
      + '<td>' + raw + ex.unit + '</td>'
      + '<td>' + c + '</td>'
      + '<td><b>' + cardsFromCount(c) + '</b></td>'
      + '<td><b>+' + coresGained(c, draft.difficulty) + '</b></td>';
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  tp.appendChild(t);
  tp.appendChild(el('div', 'mr-note',
    'コアはラン終了時に獲得。<b>敗北した場合は50%没収</b>(端数切り上げ)。'));
  scroll.appendChild(tp);

  // 生成カード
  if (generated.length){
    scroll.appendChild(el('div', 'mr-cathead', '<span>運動で生成されたカード</span><span class="bar"></span>'));
    for (const cat of CATEGORIES){
      const list = generated.filter(i => CARDS[i.id].cat === cat);
      if (!list.length) continue;
      const h = el('div', 'mr-cathead ' + cat);
      h.innerHTML = '<span>' + CAT_NAME[cat] + '(' + CAT_LABEL[cat] + ') ' + list.length + '枚</span><span class="bar"></span>';
      scroll.appendChild(h);
      scroll.appendChild(renderDeckList(list, {}));
    }
  } else {
    scroll.appendChild(el('div', 'mr-panel mr-note',
      '運動由来のカードはありません。基本デッキ8枚だけで挑みます。'
      + '<br>1種目5回(プランクは10秒)から1枚生成されます。'));
  }

  // 初期デッキ
  scroll.appendChild(el('div', 'mr-cathead', '<span>基本デッキ</span><span class="bar"></span>'));
  scroll.appendChild(renderDeckList(draft.deck.filter(i => generated.indexOf(i) < 0), {}));

  s.appendChild(scroll);

  const foot = el('div', 'mr-sticky');
  foot.appendChild(btn('この構成で開始', 'primary', () => { startRun(draft); go('MAP'); }));
  foot.appendChild(btn('入力し直す', 'ghost', () => go('EXERCISE')));
  s.appendChild(foot);
  return s;
}


/* --- 戦闘画面 --- */
function renderBattle(){
  if (!G.battle){ go('MAP'); return el('div'); }
  B = G.battle;
  const s = el('div', 'mr-screen mr-battle');

  /* 敵 */
  const et = el('div', 'mr-enemies');
  const now = Date.now();
  B.enemies.forEach((e, idx) => {
    if (e.alive) et.appendChild(renderEnemy(e, idx));
    else if (e.diedAt && now - e.diedAt < DEATH_ANIM_MS) et.appendChild(renderEnemy(e, idx));
  });
  s.appendChild(et);

  /* プレイヤー状態 */
  s.appendChild(renderPlayerStatus());

  /* ログ */
  const logBox = el('div', 'mr-log');
  logBox.innerHTML = B.log.slice(-5).map(l => '<div>' + l + '</div>').join('');
  s.appendChild(logBox);

  s.appendChild(el('div', 'mr-spacer'));

  /* 操作列 */
  const bar = el('div', 'mr-bbar');
  const en = el('div', 'mr-energy' + (B.energy > 0 ? ' on' : ''));
  en.innerHTML = '<b>' + B.energy + '</b>/' + B.maxEnergy;
  bar.appendChild(en);
  bar.appendChild(el('div', 'mr-pile', '山札 ' + B.drawPile.length));
  bar.appendChild(el('div', 'mr-pile', '捨札 ' + B.discardPile.length));
  if (B.exhaustPile.length) bar.appendChild(el('div', 'mr-pile', '除外 ' + B.exhaustPile.length));
  bar.appendChild(el('div', 'mr-spacer'));
  const endBtn = el('button', 'mr-btn small ' + (B.phase === 'PLAYER' ? 'primary' : ''),
                    B.phase === 'PLAYER' ? 'ターン終了' : '敵のターン…');
  endBtn.disabled = B.phase !== 'PLAYER';
  endBtn.addEventListener('click', endPlayerTurn);
  bar.appendChild(endBtn);
  s.appendChild(bar);

  if (B.selecting != null) s.appendChild(el('div', 'mr-hint', '↑ 対象の敵を選んでください(もう一度カードを押すとキャンセル)'));

  /* 手札 */
  const hand = el('div', 'mr-hand');
  B.hand.forEach((inst, i) => {
    const card = effectiveCard(inst);
    const playable = canPlay(inst);
    const node = renderCardEl(inst, {
      cost: cardCost(card),
      text: cardDisplayText(inst, previewTarget(card)),
      playable: playable,
      disabled: !playable,
      onClick: () => onHandCardClick(i)
    });
    if (B.selecting === i) node.classList.add('selected');
    hand.appendChild(node);
  });
  if (!B.hand.length) hand.appendChild(el('div', 'mr-note', '手札なし'));
  s.appendChild(hand);

  return s;
}

function renderEnemy(e, idx){
  const selectable = e.alive && B.selecting != null;
  const n = el('div', 'mr-enemy'
    + (selectable ? ' targetable' : '')
    + (e.alive ? '' : ' dead')
    + (e.enraged ? ' enraged' : ''));
  n.appendChild(el('div', 'eintent', e.alive ? intentText(e) : ''));
  n.appendChild(el('div', 'ename', e.name + (e.tier === 'BOSS' ? ' ' + phaseLabel(e) : '')));
  const bar = el('div', 'mr-bar');
  const fill = el('div', 'fill');
  fill.style.width = Math.max(0, (e.hp / e.maxHp) * 100) + '%';
  bar.appendChild(fill);
  // ボスはフェーズ切替の閾値をバー上に表示する
  const def = ENEMIES[e.id];
  if (def.phases.length > 1){
    for (let i = 1; i < def.phases.length; i++){
      const mark = el('span', 'phasemark');
      mark.style.left = (phaseThreshold(def.phases[i]) * 100) + '%';
      bar.appendChild(mark);
    }
  }
  bar.appendChild(el('span', 'barlabel', e.hp + ' / ' + e.maxHp));
  n.appendChild(bar);
  const row = el('div', 'estat');
  if (e.block > 0) row.appendChild(el('span', 'sblock', '🛡' + e.block));
  for (const k of ['weak','vulnerable','bleed','strength']){
    if (e.status[k] > 0) row.appendChild(el('span', 'stag ' + k,
      STATUS_ICON[k] + e.status[k]));
  }
  n.appendChild(row);
  if (selectable){
    n.addEventListener('click', () => playCard(B.selecting, idx));
  }
  return n;
}

function phaseLabel(e){
  const n = ENEMIES[e.id].phases.length;
  return n > 1 ? '(第' + (e.phaseIdx + 1) + '段階)' : '';
}

function intentText(e){
  const act = e.intent;
  if (!act) return '';
  const d = DIFFICULTY[G.run.difficulty];
  const parts = [];
  if (act.intent === 'attack'){
    const dmg = calcDamage(Math.floor(act.value * d.enemyDmgMult), e, playerActor(), {});
    parts.push(INTENT_ICON.attack + ' ' + dmg + (act.times > 1 ? '×' + act.times : ''));
  } else if (act.intent === 'block'){
    parts.push(INTENT_ICON.block + ' ' + act.value);
  } else if (act.intent === 'heal'){
    parts.push(INTENT_ICON.heal + ' ' + act.value);
  } else if (act.intent === 'buff'){
    parts.push(INTENT_ICON.buff + (act.value ? ' ' + act.value : ''));
  } else if (act.intent === 'debuff'){
    parts.push(INTENT_ICON.debuff);
  }
  if (act.strength) parts.push(INTENT_ICON.buff);
  if (act.heal && act.intent !== 'heal') parts.push(INTENT_ICON.heal + ' ' + act.heal);
  if (act.status && act.intent !== 'debuff') parts.push(INTENT_ICON.debuff);
  return parts.join(' ');
}

function renderPlayerStatus(){
  const p = el('div', 'mr-pstat');
  const bar = el('div', 'mr-bar hp');
  const fill = el('div', 'fill');
  fill.style.width = Math.max(0, (G.run.hp / G.run.maxHp) * 100) + '%';
  bar.appendChild(fill);
  bar.appendChild(el('span', 'barlabel', '❤ ' + G.run.hp + ' / ' + G.run.maxHp));
  p.appendChild(bar);

  const row = el('div', 'estat');
  if (B.block > 0)  row.appendChild(el('span', 'sblock', '🛡' + B.block + (B.keepBlock ? '*' : '')));
  if (B.evade > 0)  row.appendChild(el('span', 'stag evade', '💨' + B.evade));
  if (B.counter > 0)row.appendChild(el('span', 'stag counter', '↩' + B.counter));
  for (const k of ['weak','vulnerable','strength']){
    if (B.status[k] > 0) row.appendChild(el('span', 'stag ' + k, STATUS_ICON[k] + B.status[k]));
  }
  for (const bp of B.blockPerTurn){
    row.appendChild(el('span', 'stag', '🛡/T ' + bp.value
      + (bp.turnsLeft === Infinity ? '' : '(' + bp.turnsLeft + ')')));
  }
  // 場のPower
  const powerCount = {};
  for (const p2 of B.powers) powerCount[p2.id] = (powerCount[p2.id] || 0) + 1;
  for (const id in powerCount){
    row.appendChild(el('span', 'stag power',
      CARDS[id].name + (powerCount[id] > 1 ? '×' + powerCount[id] : '')));
  }
  if (row.childNodes.length) p.appendChild(row);
  p.appendChild(el('div', 'mr-note', 'ターン ' + B.turn));
  return p;
}

/** 現在の状態(力・脆弱・完全防御・使用済ATTACK枚数)を反映したカードテキスト */
function cardDisplayText(inst, target){
  const c = effectiveCard(inst);
  const body = c.effects.map(e => effectText(e, c, target, inst.uid)).join(' / ');
  return (c.keep ? '【Power】' : '') + body + (c.exhaust ? ' / 除外' : '');
}

/** 手札のテキスト表示で使う「たぶんこの敵に当たる」対象 */
function previewTarget(card){
  const alive = livingEnemies();
  if (!alive.length) return null;
  if (card.target === 'all') return alive[0];
  if (B.selecting != null && B.enemies[B.selecting]) return null;
  return alive.length === 1 ? alive[0] : null;
}

function onHandCardClick(i){
  const inst = B.hand[i];
  if (!inst || !canPlay(inst)) return;
  const card = effectiveCard(inst);
  const alive = livingEnemies();
  if (card.target === 'single' && alive.length > 1){
    B.selecting = (B.selecting === i) ? null : i;
    render();
    return;
  }
  const idx = B.enemies.findIndex(e => e.alive);
  playCard(i, idx);
}

function showRelicList(){
  const ov = el('div', 'mr-modal');
  const box = el('div', 'mr-modalbox');
  box.appendChild(el('div', 'mr-modaltitle', '所持レリック'));
  const ids = G.run ? G.run.relics : [];
  if (!ids.length) box.appendChild(el('div', 'mr-note', 'まだ何も持っていない'));
  for (const id of ids){
    const r = RELICS[id];
    if (!r) continue;
    box.appendChild(el('div', 'mr-panel',
      r.icon + ' <b>' + r.name + '</b><br><span class="mr-note">' + r.desc + '</span>'));
  }
  box.appendChild(btn('閉じる', 'ghost', () => document.body.removeChild(ov)));
  ov.appendChild(box);
  ov.addEventListener('click', (e) => { if (e.target === ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

/** 画面下に短く出る通知 */
function toast(html){
  const t = el('div', 'mr-toast', html);
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
}

/* --- カード選択モーダル(除去 / 強化 で共用) --- */
function openCardPicker(opts){
  const ov = el('div', 'mr-modal');
  const box = el('div', 'mr-modalbox');
  box.appendChild(el('div', 'mr-modaltitle', opts.title));
  if (opts.note) box.appendChild(el('div', 'mr-note', opts.note));
  const list = el('div', 'mr-modallist');
  const cards = opts.cards;
  if (!cards.length) list.appendChild(el('div', 'mr-note', '対象のカードがありません'));
  for (const inst of cards){
    const disabled = opts.filter ? !opts.filter(inst) : false;
    list.appendChild(renderCardEl(inst, {
      playable: !disabled, disabled: disabled,
      onClick: () => {
        if (!confirm(effectiveCard(inst).name + ' を選びますか?')) return;
        document.body.removeChild(ov);
        opts.onPick(inst);
      },
    }));
  }
  box.appendChild(list);
  if (opts.cancelable !== false){
    box.appendChild(btn('やめる', 'ghost', () => document.body.removeChild(ov)));
  }
  ov.appendChild(box);
  ov.addEventListener('click', (e) => {
    if (e.target === ov && opts.cancelable !== false) document.body.removeChild(ov);
  });
  document.body.appendChild(ov);
}

/* --- 戦闘報酬 --- */
function renderReward(){
  const run = G.run;
  if (!run.pendingReward){
    const node = currentNode();
    run.pendingReward = makeReward(node ? node.type : 'COMBAT');
    saveGame();
  }
  const rw = run.pendingReward;

  const s = el('div', 'mr-screen');
  s.appendChild(el('h2', 'mr-title', '戦闘に勝利!'));
  const scroll = el('div', 'mr-scroll');

  // ゴールド
  const gp = el('div', 'mr-panel mr-row');
  gp.appendChild(el('div', '', '💰 ゴールド <b style="color:var(--gold)">' + rw.gold + '</b>'));
  gp.appendChild(el('div', 'mr-spacer'));
  if (rw.goldTaken) gp.appendChild(el('span', 'mr-badge', '受取済'));
  else gp.appendChild(btn('受け取る', 'small primary', () => {
    gainGold(rw.gold); rw.goldTaken = true; saveGame(); render();
  }));
  scroll.appendChild(gp);

  // レリック
  if (rw.relic){
    const rp = el('div', 'mr-panel mr-row');
    const r = RELICS[rw.relic];
    rp.appendChild(el('div', '', r.icon + ' <b>' + r.name + '</b><br><span class="mr-note">' + r.desc + '</span>'));
    rp.appendChild(el('div', 'mr-spacer'));
    if (rw.relicTaken) rp.appendChild(el('span', 'mr-badge', '受取済'));
    else rp.appendChild(btn('受け取る', 'small primary', () => {
      gainRelic(rw.relic); rw.relicTaken = true; saveGame(); render();
    }));
    scroll.appendChild(rp);
  }

  // カード
  scroll.appendChild(el('div', 'mr-cathead',
    '<span>カードを1枚選ぶ' + (rw.cardTaken ? '(選択済)' : '') + '</span><span class="bar"></span>'));
  const grid = el('div', 'mr-grid');
  for (const id of rw.cards){
    const inst = { uid:-1, id:id, upgraded:false };
    grid.appendChild(renderCardEl(inst, {
      playable: !rw.cardTaken, disabled: rw.cardTaken,
      onClick: () => {
        addCardToDeck(id, false); rw.cardTaken = true; saveGame(); render();
      },
    }));
  }
  scroll.appendChild(grid);
  s.appendChild(scroll);

  const foot = el('div', 'mr-sticky');
  if (!rw.cardTaken){
    foot.appendChild(btn('カードを取らずに進む(スキップ)', 'ghost', () => {
      rw.cardTaken = true; saveGame(); render();
    }));
  }
  foot.appendChild(btn('マップへ戻る', 'primary', () => {
    if (!rw.goldTaken) gainGold(rw.gold);
    if (rw.relic && !rw.relicTaken) gainRelic(rw.relic);
    run.pendingReward = null;
    G.battle = null; B = null;
    saveGame(); go('MAP');
  }));
  s.appendChild(foot);
  return [renderHud(), s];
}

/* --- 休憩所 --- */
function renderRest(){
  const run = G.run;
  const node = currentNode();
  const d = DIFFICULTY[run.difficulty];
  const heal = Math.ceil(run.maxHp * d.restHealRate);
  const s = el('div', 'mr-screen');
  s.appendChild(el('h2', 'mr-title', '🔥 休憩所'));
  const nextIsBoss = node && node.row === BOSS_ROW - 1;
  if (nextIsBoss) s.appendChild(el('div', 'mr-warn', '⚠ 次はボス戦です'));
  s.appendChild(el('p', 'mr-sub', 'どちらか1つだけ選べます。'));

  if (node && node.restDone){
    s.appendChild(el('div', 'mr-panel', node.restResult || '休憩を終えた。'));
    s.appendChild(el('div', 'mr-spacer'));
    s.appendChild(btn('マップへ戻る', 'primary', () => go('MAP')));
    return [renderHud(), s];
  }

  const restBtn = btn('🔥 休む<br><span class="mr-note">HPを ' + heal + ' 回復(最大HPの'
    + Math.round(d.restHealRate * 100) + '%)</span>', '', () => {
    const before = run.hp;
    healPlayer(heal);
    node.restDone = true;
    node.restResult = 'HPを' + (run.hp - before) + '回復した。(' + run.hp + '/' + run.maxHp + ')';
    saveGame(); render();
  });
  s.appendChild(restBtn);

  const ups = upgradableCards();
  const upBtn = btn('⚒ 鍛える<br><span class="mr-note">'
    + (ups.length ? 'デッキから1枚を強化(+)' : '強化できるカードがない') + '</span>', '', () => {
    openCardPicker({
      title: '強化するカードを選ぶ',
      cards: ups,
      onPick(inst){
        inst.upgraded = true;
        node.restDone = true;
        node.restResult = effectiveCard(inst).name + ' に強化した。';
        saveGame(); render();
      },
    });
  });
  upBtn.disabled = !ups.length;
  s.appendChild(upBtn);

  s.appendChild(el('div', 'mr-spacer'));
  s.appendChild(btn('何もせず先へ進む', 'ghost', () => {
    node.restDone = true; node.restResult = '何もせず先へ進んだ。'; saveGame(); go('MAP');
  }));
  return [renderHud(), s];
}

/* --- ショップ --- */
function renderShop(){
  const run = G.run;
  const node = currentNode();
  if (node && !node.shopStock){ node.shopStock = makeShopStock(); saveGame(); }
  const stock = node ? node.shopStock : makeShopStock();

  const s = el('div', 'mr-screen');
  s.appendChild(el('h2', 'mr-title', '🏪 ショップ'));
  const scroll = el('div', 'mr-scroll');

  scroll.appendChild(el('div', 'mr-cathead', '<span>カード</span><span class="bar"></span>'));
  const grid = el('div', 'mr-grid');
  for (const item of stock.cards){
    const inst = { uid:-1, id:item.id, upgraded:false };
    const afford = run.gold >= item.price && !item.sold;
    const node2 = renderCardEl(inst, {
      playable: afford, disabled: !afford,
      onClick: () => {
        if (run.gold < item.price) return;
        run.gold -= item.price; item.sold = true;
        addCardToDeck(item.id, false); saveGame(); render();
      },
    });
    node2.appendChild(el('div', 'cprice' + (item.sold ? ' sold' : ''),
      item.sold ? 'SOLD' : item.price + 'G'));
    grid.appendChild(node2);
  }
  scroll.appendChild(grid);

  scroll.appendChild(el('div', 'mr-cathead', '<span>レリック</span><span class="bar"></span>'));
  for (const item of stock.relics){
    const r = RELICS[item.id];
    const row = el('div', 'mr-panel mr-row');
    row.appendChild(el('div', '', r.icon + ' <b>' + r.name + '</b><br><span class="mr-note">' + r.desc + '</span>'));
    row.appendChild(el('div', 'mr-spacer'));
    if (item.sold) row.appendChild(el('span', 'mr-badge', 'SOLD'));
    else {
      const bb = btn(item.price + 'G', 'small' + (run.gold >= item.price ? ' primary' : ''), () => {
        if (run.gold < item.price) return;
        run.gold -= item.price; item.sold = true; gainRelic(item.id); saveGame(); render();
      });
      bb.disabled = run.gold < item.price;
      row.appendChild(bb);
    }
    scroll.appendChild(row);
  }

  scroll.appendChild(el('div', 'mr-cathead', '<span>カード除去</span><span class="bar"></span>'));
  const rem = el('div', 'mr-panel mr-row');
  rem.appendChild(el('div', '', 'デッキから1枚を取り除く<br><span class="mr-note">次回は '
    + (run.removeCost + 25) + 'G に上昇</span>'));
  rem.appendChild(el('div', 'mr-spacer'));
  const canRemove = run.gold >= run.removeCost && run.deck.length > 1;
  const rb = btn(run.removeCost + 'G', 'small' + (canRemove ? ' primary' : ''), () => {
    openCardPicker({
      title: '除去するカードを選ぶ',
      note: run.removeCost + 'G を支払います',
      cards: run.deck.slice(),
      onPick(inst){
        run.gold -= run.removeCost;
        run.removeCost += 25;
        removeCardFromDeck(inst);
        saveGame(); render();
      },
    });
  });
  rb.disabled = !canRemove;
  rem.appendChild(rb);
  scroll.appendChild(rem);

  s.appendChild(scroll);
  const foot = el('div', 'mr-sticky');
  foot.appendChild(btn('デッキを見る', 'ghost', () => openCardPicker({
    title: '現在のデッキ(' + run.deck.length + '枚)', cards: run.deck.slice(),
    filter: () => false, onPick(){},
  })));
  foot.appendChild(btn('立ち去る', 'primary', () => go('MAP')));
  s.appendChild(foot);
  return [renderHud(), s];
}

/* --- 宝箱 --- */
function renderTreasure(){
  const node = currentNode();
  if (node && !node.treasure){ node.treasure = makeTreasure(); saveGame(); }
  const t = node ? node.treasure : makeTreasure();

  const s = el('div', 'mr-screen');
  s.appendChild(el('h2', 'mr-title', '🎁 宝箱'));
  const ph = el('div', 'mr-placeholder');

  if (!t.opened){
    ph.appendChild(el('div', 'mr-chest', '🎁'));
    ph.appendChild(el('div', 'mr-sub', '埃をかぶった箱がある'));
    s.appendChild(ph);
    s.appendChild(btn('開ける', 'primary', () => {
      t.opened = true;
      if (t.relic) gainRelic(t.relic); else t.gold += 50;   // 全所持済ならゴールド50
      if (t.gold) gainGold(t.gold);
      saveGame(); render();
    }));
  } else {
    ph.appendChild(el('div', 'mr-chest open', '✨'));
    if (t.relic){
      const r = RELICS[t.relic];
      ph.appendChild(el('div', 'mr-title', r.icon + ' ' + r.name));
      ph.appendChild(el('div', 'mr-sub', r.desc));
    } else {
      ph.appendChild(el('div', 'mr-sub', 'レリックは尽きていた'));
    }
    if (t.gold) ph.appendChild(el('div', '', '💰 ゴールド +' + t.gold));
    s.appendChild(ph);
    s.appendChild(btn('マップへ戻る', 'primary', () => go('MAP')));
  }
  return [renderHud(), s];
}

/* --- イベント --- */
function renderEvent(){
  const run = G.run;
  const node = currentNode();
  if (node && !node.eventId){
    node.eventId = pickEvent();
    if (!run.seenEvents) run.seenEvents = [];
    if (run.seenEvents.indexOf(node.eventId) < 0) run.seenEvents.push(node.eventId);
    saveGame();
  }
  const ev = EVENTS.find(e => e.id === (node ? node.eventId : null)) || EVENTS[0];

  const s = el('div', 'mr-screen');
  s.appendChild(el('h2', 'mr-title', '❓ ' + ev.title));
  s.appendChild(el('div', 'mr-panel', ev.text));

  if (node && node.eventResult != null){
    s.appendChild(el('div', 'mr-panel mr-result', node.eventResult));
    s.appendChild(el('div', 'mr-spacer'));
    s.appendChild(btn('マップへ戻る', 'primary', () => go('MAP')));
    return [renderHud(), s];
  }

  for (const ch of ev.choices){
    const ok = ch.enabled ? ch.enabled() : true;
    const why = ok ? '' : '<br><span class="mr-locked">条件未達: ' + (ch.why ? ch.why() : '') + '</span>';
    const b = btn('<b>' + ch.label + '</b><br><span class="mr-note">' + ch.desc + '</span>' + why, '', () => {
      if (ch.picker){
        openCardPicker({
          title: ch.picker.title,
          cards: ch.picker.list(),
          onPick(inst){ node.eventResult = ch.picker.done(inst); saveGame(); render(); },
        });
      } else {
        node.eventResult = ch.run();
        saveGame(); render();
      }
    });
    b.disabled = !ok;
    s.appendChild(b);
  }
  s.appendChild(el('div', 'mr-spacer'));
  return [renderHud(), s];
}
